<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Wallah - Classroom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      body {
        background: #020617;
        color: #f8fafc;
        overflow: hidden;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
    <style type="text/css">* {user-select: auto !important; -webkit-user-select: auto !important;}</style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="fixed top-0 left-0 right-0 h-20 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 flex items-center justify-between px-6 z-30 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-blue-400 font-extrabold text-lg">
                PW
            </div>
            <div>
                <h1 class="font-extrabold text-white text-lg tracking-tight">Physics Wallah</h1>
                <p class="text-xs font-semibold text-blue-400">Classroom Portal</p>
            </div>
        </div>
        <div class="text-xs text-blue-400 bg-blue-950 px-3 py-1.5 rounded-xl border border-blue-900/50 font-extrabold hidden sm:block">Vault Active</div>
    </nav>

    <div class="fixed top-20 left-0 right-0 px-6 py-4 bg-slate-950/80 backdrop-blur-md border-b border-slate-800 z-20">
        <div class="max-w-7xl mx-auto">
            <input id="searchInput" class="w-full bg-slate-900 border border-slate-800 focus:border-blue-500 text-white placeholder-slate-400 px-5 py-3 rounded-2xl outline-none font-medium shadow-inner text-sm transition-all" placeholder="Search batches...">
        </div>
    </div>

    <div class="fixed top-[152px] left-0 right-0 px-6 py-3 bg-slate-950/80 backdrop-blur-md border-b border-slate-800 z-20">
        <div class="max-w-7xl mx-auto flex gap-3">
            <button class="tab-btn flex-1 py-3 rounded-xl bg-blue-600 text-white text-sm font-extrabold shadow-md shadow-blue-600/30 transition-all" id="totalTab">Total Batches</button>
            <button class="tab-btn flex-1 py-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 text-sm font-extrabold shadow-sm transition-all" id="favTab">Favourites</button>
        </div>
    </div>

    <div class="content absolute top-[226px] bottom-10 left-0 right-0 overflow-y-auto px-6 py-6">
        <div class="max-w-7xl mx-auto">
            <div id="total" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
            <div id="fav" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4" style="display: none"></div>
        </div>
    </div>

    <footer class="fixed bottom-0 left-0 right-0 h-10 bg-slate-900/90 backdrop-blur-md border-t border-slate-800 flex items-center justify-center text-xs font-bold text-slate-400 z-30">
        Developed by <span class="text-blue-400 font-extrabold ml-1">Devansh Sharma</span>
    </footer>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }

      const FALLBACK_IMG = "https://devcoderz.vercel.app/pw.png";

      let ALL = [];
      let filtered = [];

      let favs = JSON.parse(localStorage.getItem("favs") || "[]");
      let cachedBatches = JSON.parse(localStorage.getItem("fav_batches") || "{}");

      if (localStorage.getItem("batch_cache")) {
        localStorage.removeItem("batch_cache");
      }

      const total = document.getElementById("total");
      const fav = document.getElementById("fav");
      const content = document.querySelector(".content");

      const totalTab = document.getElementById("totalTab");
      const favTab = document.getElementById("favTab");

      let loaded = 0, LIMIT = 12, loading = false;

      showSkeleton();

      fetch("https://devcoderz-backend.vercel.app/api/batches")
        .then((r) => r.json())
        .then((d) => {
          ALL = d.batches || d.data?.batches || d.data || [];
          filtered = ALL;
          setTimeout(() => { loadMore(true); }, 300);
        })
        .catch(() => {
          ALL = Object.values(cachedBatches);
          filtered = ALL;
          if (ALL.length) {
            loadMore(true);
          } else {
            total.innerHTML = `<div class="col-span-full text-center text-slate-400 font-semibold py-16 bg-slate-900 rounded-2xl border border-slate-800">Failed to load system clusters</div>`;
          }
        });

      function normalizeText(t) {
        return (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
      }

      function tokenize(t) {
        return normalizeText(t).split(/\s+/).map((x) => x.replace(/[^a-z0-9]+/g, "")).filter(Boolean);
      }

      function calcLevenshtein(a, b) {
        if (!a.length) return b.length;
        if (!b.length) return a.length;
        let prev = Array(b.length + 1).fill(0).map((_, i) => i);
        let curr = Array(b.length + 1);
        for (let i = 0; i < a.length; i++) {
          curr[0] = i + 1;
          for (let j = 0; j < b.length; j++) {
            curr[j + 1] = Math.min(curr[j] + 1, prev[j + 1] + 1, prev[j] + (a[i] === b[j] ? 0 : 1));
          }
          [prev, curr] = [curr, prev];
        }
        return prev[b.length];
      }

      function performFuzzySearch(searchTerm, sourceArray) {
        if (!searchTerm) return sourceArray.slice();
        const normalized = normalizeText(searchTerm);
        const tokens = tokenize(searchTerm).filter((t) => t.length >= 1);
        const results = [];

        sourceArray.forEach((batch, idx) => {
          let bName = batch.name || batch.batchName || batch.title || "";
          const batchNorm = normalizeText(bName);
          let score = 0, matchType = "none";

          if (batchNorm === normalized) {
            score = 1000;
            matchType = "exact";
          } else if (batchNorm.includes(normalized)) {
            score = 500;
            matchType = "substring";
          } else {
            const batchTokens = tokenize(bName).filter((t) => t.length >= 1);
            if (!batchTokens.length || !tokens.length) return;
            let totalScore = 0, matched = 0, exactMatches = 0;

            tokens.forEach((st) => {
              let best = 0, foundExact = false;
              batchTokens.forEach((bt) => {
                if (bt === st) { foundExact = true; best = 100; }
                else if (bt.includes(st) && st.length >= 2) best = Math.max(best, 85);
                else if (st.includes(bt) && bt.length >= 2) best = Math.max(best, 75);
                else {
                  const mx = Math.max(st.length, bt.length);
                  const sim = ((mx - calcLevenshtein(st, bt)) / mx) * 100;
                  if (sim > best) best = sim;
                }
              });
              if (best >= 40) { totalScore += best; matched++; if (foundExact) exactMatches++; }
            });

            if (matched > 0) {
              const avg = totalScore / tokens.length;
              const matchRatio = matched / tokens.length;
              if (avg >= 55) {
                score = avg * matchRatio * 10;
                if (exactMatches > 0) score += exactMatches * 50;
                if (matchRatio === 1) score += 100;
                matchType = "fuzzy";
              }
            }
          }

          if (matchType !== "none") {
            results.push({ batch, score: Math.round(score), index: idx, matchType });
          }
        });

        results.sort((a, b) => {
          if (a.matchType !== b.matchType) {
            const order = { exact: 0, substring: 1, fuzzy: 2 };
            return order[a.matchType] - order[b.matchType];
          }
          return b.score - a.score || a.index - b.index;
        });
        return results.map((r) => r.batch);
      }

      function showSkeleton() {
        let skel = "";
        for (let i = 0; i < 8; i++) {
          skel += `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-sm animate-pulse">
            <div class="h-5 bg-slate-800 rounded-lg w-3/4"></div>
            <div class="h-40 bg-slate-950 border border-slate-800 rounded-xl"></div>
            <div class="space-y-2">
                <div class="h-3 bg-slate-800 rounded w-1/2"></div>
                <div class="h-3 bg-slate-800 rounded w-1/3"></div>
            </div>
            <div class="h-10 bg-slate-800 rounded-xl mt-4"></div>
        </div>`;
        }
        total.innerHTML = skel;
      }

      function card(b) {
        let bId = b._id || b.id || b.batchId;
        let isFav = favs.includes(bId);
        let bName = b.name || b.batchName || b.title || "Premium Course Allocation";
        let bBy = b.byName || "Classroom Node";
        let bLang = b.language || "Hinglish";
        let bStart = b.startDate || "Active Slot";
        let bEnd = b.endDate || "Ongoing";
        let bPrice = b.feeTotal || b.price;
        let finalPrice = bPrice === 0 || b.isFree ? "Free" : `₹ ${bPrice}`;

        let bImage = FALLBACK_IMG;
        if (b.previewImage && b.previewImage !== "/pwbatch.png") {
          bImage = b.previewImage;
        } else if (b.thumbnail && b.thumbnail !== "/pwbatch.png") {
          bImage = b.thumbnail;
        } else if (b.imageId?.baseUrl && b.imageId?.key) {
          bImage = b.imageId.baseUrl + b.imageId.key;
        }

        return `
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between relative shadow-sm hover:shadow-xl hover:border-blue-500/50 transition-all duration-300 group" data-id="${bId}">
        <button class="absolute top-4 right-4 w-9 h-9 rounded-xl border border-slate-700 bg-slate-950 flex items-center justify-center cursor-pointer z-5 shadow-md hover:bg-slate-800 transition favorite-btn ${isFav ? "border-rose-500/50" : ""}">
            ${isFav ? "❤️" : "♡"}
        </button>
        <div>
            <div class="font-extrabold text-white mb-3 text-base group-hover:text-blue-400 transition-colors line-clamp-2 pr-10">${bName}</div>
            <div class="w-full h-40 rounded-xl bg-slate-950 border border-slate-800 overflow-hidden mb-4 relative flex items-center justify-center">
                <img loading="lazy" src="${bImage}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='${FALLBACK_IMG}'">
            </div>
            <div class="space-y-1.5 mb-4 text-xs font-semibold text-slate-300">
                <div class="flex items-center gap-2"><span>👨‍🎓</span> ${bBy}</div>
                <div class="flex items-center gap-2"><span>🗣️</span> ${bLang}</div>
                <div class="flex items-center gap-2"><span>🗓️</span> ${bStart} → ${bEnd}</div>
            </div>
        </div>
        <div>
            <div class="font-extrabold text-blue-400 text-sm mb-3">${finalPrice}</div>
            <button class="w-full bg-blue-600 text-white py-2.5 rounded-xl text-sm font-extrabold shadow-md shadow-blue-600/30 hover:bg-blue-700 transition explore-btn" data-id="${bId}">Explore Batch</button>
        </div>
    </div>`;
      }

      function loadMore(reset = false) {
        if (loading) return;
        loading = true;
        if (reset) { total.innerHTML = ""; loaded = 0; }
        let slice = filtered.slice(loaded, loaded + LIMIT);
        if (!slice.length && loaded === 0) {
          total.innerHTML = `<div class="col-span-full text-center text-slate-400 font-semibold py-16 bg-slate-900 rounded-2xl border border-slate-800">No batches found</div>`;
          loading = false;
          return;
        }
        total.innerHTML += slice.map(card).join("");
        loaded += LIMIT;
        loading = false;
      }

      content.addEventListener("scroll", () => {
        if (total.style.display === "none") return;
        if (content.scrollTop + content.clientHeight >= content.scrollHeight - 50) {
          loadMore();
        }
      });

      document.addEventListener("click", (e) => {
        if (e.target.closest(".favorite-btn")) {
          const btnEl = e.target.closest(".favorite-btn");
          let id = btnEl.closest(".bg-slate-900").dataset.id;
          let batch = ALL.find((b) => (b._id || b.id || b.batchId) === id);

          if (favs.includes(id)) {
            favs = favs.filter((f) => f !== id);
            delete cachedBatches[id];
          } else {
            favs.push(id);
            if (batch) {
              cachedBatches[id] = batch;
            } else if (!cachedBatches[id]) {
              fetch("/list.js")
                .then((r) => r.json())
                .then((d) => {
                  let list = d.batches || d.data?.batches || d.data || [];
                  let found = list.find((b) => (b._id || b.id || b.batchId) === id);
                  if (found) {
                    cachedBatches[id] = found;
                    localStorage.setItem("fav_batches", JSON.stringify(cachedBatches));
                  }
                });
            }
          }

          localStorage.setItem("favs", JSON.stringify(favs));
          localStorage.setItem("fav_batches", JSON.stringify(cachedBatches));

          document.querySelectorAll(`.bg-slate-900[data-id="${id}"] .favorite-btn`).forEach((b) => {
              b.classList.toggle("border-rose-500/50", favs.includes(id));
              b.innerHTML = favs.includes(id) ? "❤️" : "♡";
          });

          if (fav.style.display === "grid") { renderFav(); }
        }

        if (e.target.classList.contains("explore-btn")) {
          let id = e.target.dataset.id;
          window.location.href = "/batches.html?batch_id=" + id;
        }
      });

      function setActive(tab) {
        totalTab.className = "tab-btn flex-1 py-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 text-sm font-extrabold shadow-sm transition-all";
        favTab.className = "tab-btn flex-1 py-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 text-sm font-extrabold shadow-sm transition-all";
        
        tab.className = "tab-btn flex-1 py-3 rounded-xl bg-blue-600 text-white text-sm font-extrabold shadow-md shadow-blue-600/30 transition-all";
      }

      totalTab.onclick = () => {
        setActive(totalTab);
        total.style.display = "grid";
        fav.style.display = "none";
      };

      favTab.onclick = () => {
        setActive(favTab);
        total.style.display = "none";
        fav.style.display = "grid";
        renderFav();
      };

      function renderFav() {
        let items = favs.map((id) => cachedBatches[id]).filter(Boolean);
        fav.innerHTML = items.length
          ? items.map(card).join("")
          : `<div class="col-span-full text-center text-slate-400 font-semibold py-16 bg-slate-900 rounded-2xl border border-slate-800">No favourites yet ❤️</div>`;
      }

      document.getElementById("searchInput").oninput = function () {
        let q = this.value.trim();
        content.scrollTo({ top: 0, behavior: "smooth" });
        filtered = performFuzzySearch(q, ALL);
        loadMore(true);
      };
    </script>
</body>
</html>
