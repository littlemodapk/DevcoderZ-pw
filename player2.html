<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevCoderZ Video Player Debugger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
<style>
  body {
    margin: 0;
    background: #0f0f0f;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 20px;
  }
  .player-container {
    width: 90%;
    max-width: 960px;
  }
  video {
    width: 100%;
    height: auto;
    background: #000;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
  }
  .debug-console {
    width: 90%;
    max-width: 960px;
    margin-top: 20px;
    background: #181818;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 15px;
    max-height: 250px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 13px;
    color: #00ff66;
    box-sizing: border-box;
  }
  .debug-console h3 {
    margin: 0 0 10px 0;
    font-size: 14px;
    color: #fff;
    border-bottom: 1px solid #333;
    padding-bottom: 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .clear-btn {
    background: #333;
    color: #fff;
    border: none;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
  }
  .clear-btn:hover {
    background: #555;
  }
  .log-entry {
    margin-bottom: 4px;
    word-break: break-all;
  }
  .log-error { color: #ff4d4d; }
  .log-warn { color: #ffad33; }
  .log-info { color: #33ccff; }
</style>
</head>
<body>

<div class="player-container">
  <video id="videoElement" controls autoplay></video>
</div>

<div class="debug-console">
  <h3>
    <span>Debug Console</span>
    <button class="clear-btn" id="clearConsole">Clear</button>
  </h3>
  <div id="logContainer"></div>
</div>

<script>
  function logToConsole(message, type = 'info') {
    const container = document.getElementById('logContainer');
    const entry = document.createElement('div');
    entry.className = `log-entry log-${type}`;
    const timestamp = new Date().toLocaleTimeString();
    entry.textContent = `[${timestamp}] ${message}`;
    container.appendChild(entry);
    container.scrollTop = container.scrollHeight;
  }

  document.getElementById('clearConsole').addEventListener('click', () => {
    document.getElementById('logContainer').innerHTML = '';
  });

  document.addEventListener('DOMContentLoaded', async () => {
    shaka.polyfill.installAll();
    
    if (!shaka.Player.isBrowserSupported()) {
      logToConsole('Browser Error: Shaka Player is not supported.', 'error');
      alert('Browser not supported for Shaka Player.');
      return;
    }

    const params = new URLSearchParams(window.location.search);
    const batchId = params.get('batchId');
    const subjectId = params.get('subjectId');
    const lectureId = params.get('lectureId');

    if (!batchId || !lectureId) {
      logToConsole('Validation Error: Missing batchId or lectureId.', 'error');
      alert('Missing batchId or lectureId in URL query parameters.');
      return;
    }

    const video = document.getElementById('videoElement');
    const player = new shaka.Player(video);

    player.addEventListener('error', (event) => {
      logToConsole(`Shaka Error Code: ${event.detail.code}, Category: ${event.detail.category}`, 'error');
      console.error('Shaka Player Runtime Error:', event.detail);
    });

    // Networking engine filter: Cloudfront ke kisi bhi request (manifest ya segments/init) ko automatic proxy se route karega
    const networkingEngine = player.getNetworkingEngine();
    if (networkingEngine) {
      networkingEngine.registerRequestFilter((type, request) => {
        let originalUrl = request.uris[0];

        // Agar URL me pehle se proxy laga hai ya cloudfront ka nahi hai toh chhod do
        if (originalUrl.includes('/api/play?url=') || !originalUrl.includes('d1d34p8vz63oiq.cloudfront.net')) {
          return;
        }

        // Cloudfront ke har request ko proxy URL me wrap kar do
        request.uris[0] = `https://www.learnxpw.site/api/play?url=${encodeURIComponent(originalUrl)}`;
        logToConsole(`Proxied Request: ${originalUrl.split('/').pop().split('?')[0]}`, 'info');
      });
    }

    try {
      logToConsole('Fetching video metadata from API...', 'info');
      
      const response = await fetch(`https://examcrushers.in/api/video-url`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ batchId, subjectId, lectureId })
      });

      const result = await response.json();

      if (!result.success) {
        logToConsole('API Error: ' + (result.error || 'Unknown error'), 'error');
        alert('Failed to fetch video: ' + (result.error || 'Unknown error'));
        return;
      }

      logToConsole('API Response received successfully.', 'info');

      const rawDashUrl = result.data.fullDash || result.data.dashUrl;
      
      // Manifest URL ko shuru me hi proxy ke sath load karwayenge
      const playUrl = `https://www.learnxpw.site/api/play?url=${encodeURIComponent(rawDashUrl)}`;
      logToConsole(`Final Manifest URL: ${playUrl}`, 'info');

      if (result.kid && result.license) {
        let clearKeysObj = {};
        if (result.license.clearKeys) {
          clearKeysObj = result.license.clearKeys;
        } else {
          clearKeysObj = {
            [result.kid]: result.license.key || result.license
          };
        }

        logToConsole(`Configuring DRM ClearKeys for KID: ${result.kid}`, 'info');
        player.configure({
          drm: {
            clearKeys: clearKeysObj
          }
        });
      } else {
        logToConsole('Warning: No DRM clearKeys found in API response.', 'warn');
      }

      logToConsole('Loading manifest into Shaka Player...', 'info');
      await player.load(playUrl);
      logToConsole('Playback started successfully!', 'info');

    } catch (err) {
      const errorMsg = err && err.code ? `Shaka Error Code: ${err.code} (Category: ${err.category})` : (err.message || JSON.stringify(err));
      logToConsole('Critical Exception: ' + errorMsg, 'error');
      console.error('Critical Playback Exception Error:', err);
    }
  });
</script>

</body>
</html>
