<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevCoderZ Video Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
<style>
  body {
    margin: 0;
    background: #0f0f0f;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .player-container {
    width: 90%;
    max-width: 960px;
  }
  video {
    width: 100%;
    height: auto;
    background: #000;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
  }
</style>
</head>
<body>

<div class="player-container">
  <video id="videoElement" controls autoplay></video>
</div>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) {
      alert('Browser not supported for Shaka Player.');
      return;
    }

    const params = new URLSearchParams(window.location.search);
    const streamUrl = params.get('url');
    const kid = params.get('kid');
    const key = params.get('key');

    if (!streamUrl) {
      alert('Missing "url" query parameter.');
      return;
    }

    const video = document.getElementById('videoElement');
    const player = new shaka.Player(video);

    player.addEventListener('error', (event) => {
      console.error('Error code', event.detail.code, 'object', event.detail);
    });

    try {
      if (kid && key) {
        player.configure({
          drm: {
            clearKeys: {
              [kid]: key
            }
          }
        });
      }

      await player.load(decodeURIComponent(streamUrl));
    } catch (err) {
      console.error('Playback error:', err);
      alert('An error occurred while loading the video.');
    }
  });
</script>

</body>
</html>
