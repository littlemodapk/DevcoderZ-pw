<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevCoderZ Video Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
<style>
  body {
    margin: 0;
    background: #0f0f0f;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .player-container {
    width: 90%;
    max-width: 960px;
  }
  video {
    width: 100%;
    height: auto;
    background: #000;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
  }
  .input-group {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  input, button {
    padding: 10px 15px;
    background: #1e1e1e;
    color: #fff;
    border: 1px solid #333;
    border-radius: 5px;
    font-size: 14px;
    outline: none;
  }
  input {
    flex: 1;
    min-width: 180px;
  }
  button {
    background: #e50914;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }
  button:hover {
    background: #b20710;
  }
</style>
</head>
<body>

<div class="player-container">
  <video id="videoElement" controls autoplay></video>
  <div class="input-group">
    <input type="text" id="batchIdInput" placeholder="Batch ID">
    <input type="text" id="subjectIdInput" placeholder="Subject ID">
    <input type="text" id="lectureIdInput" placeholder="Lecture ID">
    <button id="playBtn">Play</button>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) {
      alert('Browser not supported for Shaka Player.');
      return;
    }

    const video = document.getElementById('videoElement');
    const player = new shaka.Player(video);

    player.addEventListener('error', (event) => {
      console.error('Error code', event.detail.code, 'object', event.detail);
    });

    document.getElementById('playBtn').addEventListener('click', async () => {
      const batchId = document.getElementById('batchIdInput').value.trim();
      const subjectId = document.getElementById('subjectIdInput').value.trim();
      const lectureId = document.getElementById('lectureIdInput').value.trim();

      if (!batchId || !lectureId) {
        alert('Batch ID and Lecture ID are required.');
        return;
      }

      try {
        const response = await fetch(`https://Examcrushers.in/api/handler`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ batchId, subjectId, lectureId })
        });

        const result = await response.json();

        if (!result.success) {
          alert('Failed to fetch video: ' + (result.error || 'Unknown error'));
          return;
        }

        const playUrl = result.data.streamDash || result.data.fullDash;

        if (result.kid && result.license) {
          player.configure({
            drm: {
              clearKeys: {
                [result.kid]: result.license.key || result.license
              }
            }
          });
        }

        await player.load(playUrl);
      } catch (err) {
        console.error('Playback error:', err);
        alert('An error occurred while loading the video.');
      }
    });
  });
</script>

</body>
</html>
