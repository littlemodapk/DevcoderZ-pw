<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Dynamic HLS Stream Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: Arial, sans-serif;
            color: #fff;
            padding: 20px;
        }
        #container {
            width: 100%;
            max-width: 900px;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        video { 
            width: 100%; 
            border-radius: 8px;
            background: #111;
            aspect-ratio: 16/9;
        }
        #status {
            color: #4fc3f7;
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
            min-height: 24px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button, input {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        input {
            flex: 1;
            min-width: 250px;
            cursor: text;
        }
        input:focus { border-color: #4fc3f7; outline: none; }
        button:hover { background: #3a3a3a; border-color: #4fc3f7; }
        .error { color: #ff6b6b; }
        .success { color: #69db7c; }
    </style>
</head>
<body>
    <div id="container">
        <video id="video" controls playsinline></video>
        <div id="status">🔄 Enter your API or Stream URL to begin...</div>
        <div class="controls">
            <input type="text" id="apiUrlInput" placeholder="Enter API URL or M3U8 Link..." />
            <button onclick="handlePlay()">▶ Play Stream</button>
            <button onclick="reloadStream()">🔄 Reload</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        const apiUrlInput = document.getElementById('apiUrlInput');

        let hls = null;
        let shakaPlayer = null;

        function setStatus(msg, type = 'info') {
            status.innerHTML = msg;
            status.className = type;
        }

        function destroyPlayers() {
            if (hls) {
                hls.destroy();
                hls = null;
            }
            if (shakaPlayer) {
                shakaPlayer.destroy();
                shakaPlayer = null;
            }
            video.removeAttribute('src');
            video.load();
        }

        async function handlePlay() {
            let inputVal = apiUrlInput.value.trim();
            if (!inputVal) {
                setStatus('❌ Please enter a valid URL or API endpoint', 'error');
                return;
            }

            destroyPlayers();
            setStatus('🔄 Fetching stream data...', 'info');

            let streamUrl = inputVal;
            let clearKeys = null;

            if (inputVal.includes('batchId') || inputVal.includes('lectureId') || inputVal.includes('scheduleId') || !inputVal.endsWith('.m3u8')) {
                try {
                    const res = await fetch(inputVal);
                    const data = await res.json();
                    if (data.success && data.url) {
                        streamUrl = data.url;
                        if (data.keys) {
                            clearKeys = data.keys;
                        }
                    } else {
                        throw new Error(data.error || 'Invalid API response structure');
                    }
                } catch (err) {
                    setStatus('❌ API Fetch Error: ' + err.message, 'error');
                    return;
                }
            }

            playStream(streamUrl, clearKeys);
        }

        function playStream(url, keys) {
            setStatus('🔄 Initializing player...', 'info');

            if (keys && Object.keys(keys).length > 0) {
                playEncryptedStream(url, keys);
                return;
            }

            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                setStatus('📺 Playing with native HLS (Safari)', 'success');
                video.play().catch(e => console.log('Autoplay blocked'));
                return;
            }

            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    xhrSetup: function(xhr, reqUrl) {
                        xhr.withCredentials = false;
                        xhr.setRequestHeader('Origin', window.location.origin);
                    }
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        setStatus('❌ Fatal HLS error: ' + data.type, 'error');
                    }
                });

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    setStatus('✅ Stream loaded successfully!', 'success');
                    video.play().catch(e => console.log('Autoplay blocked'));
                });

                hls.attachMedia(video);
                hls.loadSource(url);
            } else {
                setStatus('❌ HLS is not supported in this browser', 'error');
            }
        }

        async function playEncryptedStream(url, keys) {
            shaka.polyfill.installAll();
            if (!shaka.Player.isBrowserSupported()) {
                setStatus('❌ Browser not supported for encrypted streams', 'error');
                return;
            }

            shakaPlayer = new shaka.Player(video);
            
            shakaPlayer.addEventListener('error', (event) => {
                setStatus('❌ Shaka Error: ' + event.detail.message, 'error');
            });

            try {
                shakaPlayer.configure({
                    drm: {
                        clearKeys: keys
                    }
                });

                await shakaPlayer.load(url);
                setStatus('✅ Encrypted stream loaded successfully via Shaka!', 'success');
                video.play().catch(e => console.log('Autoplay blocked'));
            } catch (error) {
                setStatus('❌ Failed to load encrypted stream: ' + error.message, 'error');
            }
        }

        function reloadStream() {
            handlePlay();
        }

        window.handlePlay = handlePlay;
        window.reloadStream = reloadStream;
    </script>
</body>
</html>
