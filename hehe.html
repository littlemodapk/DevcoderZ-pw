<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCoderZ Secure Enterprise Player</title>
    <!-- Shaka Player compiled library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .player-wrapper {
            width: 100%;
            max-width: 960px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }
        .architectural-header {
            background: #1f2937;
            padding: 12px 20px;
            font-size: 12px;
            font-family: monospace;
            color: #38bdf8;
            border-bottom: 1px solid #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            display: block;
        }
        .telemetry-bar {
            padding: 16px 20px;
            font-size: 13px;
            background: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stream-meta {
            color: #9ca3af;
            font-family: monospace;
        }
        .node-status {
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
        }
        .node-status.initializing { background: #78350f; color: #fde68a; }
        .node-status.active { background: #064e3b; color: #6ee7b7; }
        .node-status.failure { background: #7f1d1d; color: #fca5a5; }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <div class="architectural-header">
            <span>LAYER-1: QUANTUM-ENCRYPTED PLAYER ENGINE [ACTIVE]</span>
            <span>GATEWAY: ROUTING & ORCHESTRATION OK</span>
        </div>
        <video id="quantumVideoElement" controls autoplay playsinline></video>
        <div class="telemetry-bar">
            <span id="streamMetaText" class="stream-meta">Initializing Pipeline...</span>
            <span id="nodeStatusBadge" class="node-status initializing">SYNCHRONIZING</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', initializePlayerPipeline);

        async function initializePlayerPipeline() {
            const videoElement = document.getElementById('quantumVideoElement');
            const streamMetaText = document.getElementById('streamMetaText');
            const nodeStatusBadge = document.getElementById('nodeStatusBadge');

            // 1. Resolve Parameters from Gateway (URL)
            const urlParams = new URLSearchParams(window.location.search);
            const batchId = urlParams.get('batchId');
            const subjectId = urlParams.get('subjectId');
            const lectureId = urlParams.get('lectureId');
            const key = urlParams.get('key');

            if (!batchId || !lectureId) {
                nodeStatusBadge.textContent = "PARAMS_MISSING";
                nodeStatusBadge.className = "node-status failure";
                streamMetaText.textContent = "Error: Required orchestration parameters (batchId, lectureId) are absent.";
                return;
            }

            // 2. Query Orchestration & Stream Resolution Endpoint
            const apiEndpoint = `https://examcrushers.in/api/video-url?batchId=${batchId}&subjectId=${subjectId || 'hehe'}&lectureId=${lectureId}&key=${key || 'Sharma'}`;

            try {
                streamMetaText.textContent = "Resolving through Distributed Traffic Shaper...";
                const response = await fetch(apiEndpoint);
                const payload = await response.json();

                if (!payload.success || !payload.url) {
                    throw new Error(payload.error || "Failed to resolve stream via API orchestration layer.");
                }

                const rawMasterUri = payload.url;
                const clearKeysMap = payload.keys || {};

                // Extract CloudFront Token signatures for edge authentication routing
                const parsedMasterUrl = new URL(rawMasterUri);
                const edgeSignatureQuery = parsedMasterUrl.search; 

                streamMetaText.textContent = "Scrubbing DRM Manifest & Constructing Sandbox Blob...";

                // 3. Edge Manifest Fetching & ContentProtection Stripping (Bypassing 6007/Widevine lock)
                const manifestFetchResponse = await fetch(rawMasterUri);
                let manifestBody = await manifestFetchResponse.text();

                // Sanitize all Widevine schemas to force pure hardware-agnostic ClearKey decryption
                manifestBody = manifestBody.replace(/<ContentProtection[^>]*schemeIdUri="urn:uuid:edef8ba9-79d6-4ace-a3c8-27dcd51d21ed"[^>]*>[\s\S]*?<\/ContentProtection>/gi, '');
                manifestBody = manifestBody.replace(/<ContentProtection[^>]*schemeIdUri="urn:uuid:edef8ba9-79d6-4ace-a3c8-27dcd51d21ed"[^>]*\/>/gi, '');

                // Generate localized sandbox Blob URI for Shaka Player runtime
                const sanitizedBlob = new Blob([manifestBody], { type: 'application/dash+xml' });
                const sandboxManifestUri = URL.createObjectURL(sanitizedBlob);

                streamMetaText.textContent = `Injecting Stream: ${lectureId}`;
                nodeStatusBadge.textContent = "INITIALIZING SHAKA";

                // 4. Initialize Core Shaka Player Sandbox
                shaka.polyfill.installAll();
                if (!shaka.Player.isBrowserSupported()) {
                    throw new Error('Browser environment incompatible with Shaka Player architecture.');
                }

                const player = new shaka.Player(videoElement);

                // Configure Direct ClearKeys decryption mapper
                if (Object.keys(clearKeysMap).length > 0) {
                    player.configure({
                        drm: {
                            clearKeys: clearKeysMap,
                            servers: {},
                            advanced: {
                                'org.w3.clearkey': { clearKeys: clearKeysMap }
                            }
                        }
                    });
                }

                // 5. Distributed Traffic Edge Interceptor (Injecting AWS CloudFront security signatures per segment)
                player.getNetworkingEngine().registerRequestFilter((type, request) => {
                    if (request.uris[0].startsWith('blob:')) return;

                    if (edgeSignatureQuery && !request.uris[0].includes('Signature=')) {
                        if (request.uris[0].includes('?')) {
                            request.uris[0] += '&' + edgeSignatureQuery.substring(1);
                        } else {
                            request.uris[0] += edgeSignatureQuery;
                        }
                    }
                });

                // Global Telemetry Error Handlers
                player.addEventListener('error', (event) => {
                    console.error('Playback Fault Code:', event.detail.code, event.detail);
                    nodeStatusBadge.textContent = `ERROR_${event.detail.code}`;
                    nodeStatusBadge.className = "node-status failure";
                    streamMetaText.textContent = `Fault encountered: Code ${event.detail.code}`;
                });

                // Load Sandbox Stream
                await player.load(sandboxManifestUri);
                nodeStatusBadge.textContent = "STREAM_ACTIVE";
                nodeStatusBadge.className = "node-status active";
                streamMetaText.textContent = `Streaming Node: ${lectureId} [Secured]`;

            } catch (err) {
                console.error('Pipeline Initialization Exception:', err);
                nodeStatusBadge.textContent = "SYSTEM_FAULT";
                nodeStatusBadge.className = "node-status failure";
                streamMetaText.textContent = err.message;
            }
        }
    </script>
</body>
</html>
