<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCoderZ Secure Video Player</title>
    <!-- Shaka Player compiled library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .player-container {
            width: 100%;
            max-width: 900px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            display: block;
        }
        .info-box {
            padding: 16px;
            font-size: 14px;
            color: #94a3b8;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status {
            font-weight: 600;
        }
        .status.loading { color: #f59e0b; }
        .status.success { color: #10b981; }
        .status.error { color: #ef4444; }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="videoElement" controls autoplay></video>
        <div class="info-box">
            <span id="videoTitle">Initializing Player...</span>
            <span id="statusText" class="status loading">Connecting API</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', initApp);

        async function initApp() {
            const video = document.getElementById('videoElement');
            const statusText = document.getElementById('statusText');
            const videoTitle = document.getElementById('videoTitle');

            // 1. Get dynamic parameters from URL
            const urlParams = new URLSearchParams(window.location.search);
            const batchId = urlParams.get('batchId');
            const subjectId = urlParams.get('subjectId');
            const lectureId = urlParams.get('lectureId');
            const key = urlParams.get('key');

            if (!batchId || !lectureId) {
                statusText.textContent = "Missing Parameters";
                statusText.className = "status error";
                videoTitle.textContent = "Error: Please provide batchId and lectureId in URL parameters.";
                return;
            }

            // 2. Construct API URL
            const apiUrl = `https://examcrushers.in/api/video-url?batchId=${batchId}&subjectId=${subjectId || 'hehe'}&lectureId=${lectureId}&key=${key || 'Sharma'}`;

            try {
                statusText.textContent = "Fetching Stream...";
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!data.success || !data.url) {
                    throw new Error(data.error || "Failed to retrieve stream URL from API.");
                }

                const originalManifestUri = data.url;
                const rawKeys = data.keys || {};

                // Extract query parameters (Signature, Policy, Key-Pair-Id) from main manifest URL
                const mainUrlObj = new URL(originalManifestUri);
                const searchParamsString = mainUrlObj.search; 

                statusText.textContent = "Processing Manifest...";

                // 3. FETCH MPD TEXT AND STRIP WIDEVINE PROTECTION TAGS
                const mpdResponse = await fetch(originalManifestUri);
                let mpdText = await mpdResponse.text();

                // Remove Widevine ContentProtection blocks so Shaka only relies on ClearKeys
                mpdText = mpdText.replace(/<ContentProtection[^>]*schemeIdUri="urn:uuid:edef8ba9-79d6-4ace-a3c8-27dcd51d21ed"[^>]*>[\s\S]*?<\/ContentProtection>/gi, '');
                mpdText = mpdText.replace(/<ContentProtection[^>]*schemeIdUri="urn:uuid:edef8ba9-79d6-4ace-a3c8-27dcd51d21ed"[^>]*\/>/gi, '');

                // Create a local Blob URL for the modified manifest
                const blob = new Blob([mpdText], { type: 'application/dash+xml' });
                const manifestUri = URL.createObjectURL(blob);

                videoTitle.textContent = `Lecture ID: ${lectureId}`;
                statusText.textContent = "Loading Shaka Player...";

                // 4. Initialize Shaka Player
                shaka.polyfill.installAll();
                if (!shaka.Player.isBrowserSupported()) {
                    throw new Error('Browser not supported for Shaka Player!');
                }

                const player = new shaka.Player(video);

                // 5. Configure ClearKeys DRM
                if (Object.keys(rawKeys).length > 0) {
                    player.configure({
                        drm: {
                            clearKeys: rawKeys
                        }
                    });
                }

                // 6. Intercept segments to inject Signature, Policy & Key-Pair-Id automatically
                player.getNetworkingEngine().registerRequestFilter((type, request) => {
                    // Do not touch the blob URL request, only segment requests
                    if (request.uris[0].startsWith('blob:')) return;

                    if (searchParamsString && !request.uris[0].includes('Signature=')) {
                        if (request.uris[0].includes('?')) {
                            request.uris[0] += '&' + searchParamsString.substring(1);
                        } else {
                            request.uris[0] += searchParamsString;
                        }
                    }
                });

                // Listen for error events
                player.addEventListener('error', (event) => {
                    console.error('Error code', event.detail.code, 'object', event.detail);
                    statusText.textContent = `Playback Error (${event.detail.code})`;
                    statusText.className = "status error";
                });

                // Load the modified manifest blob
                await player.load(manifestUri);
                statusText.textContent = "Streaming Live (DASH)";
                statusText.className = "status success";
                
            } catch (err) {
                console.error('Initialization error:', err);
                statusText.textContent = "Failed to load";
                statusText.className = "status error";
                videoTitle.textContent = err.message;
            }
        }
    </script>
</body>
</html>
