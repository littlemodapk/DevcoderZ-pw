<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCoderZ Secure Player</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .player-wrapper {
            width: 100%;
            max-width: 960px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,.7);
        }

        .header {
            background: #1f2937;
            padding: 12px 20px;
            font: 12px monospace;
            color: #38bdf8;
            border-bottom: 1px solid #374151;
            display: flex;
            justify-content: space-between;
        }

        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            background: #000;
        }

        .telemetry {
            padding: 15px 20px;
            background: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .meta {
            color: #9ca3af;
            font: 13px monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status {
            padding: 5px 10px;
            border-radius: 6px;
            font: 600 12px monospace;
            white-space: nowrap;
        }

        .initializing {
            background: #78350f;
            color: #fde68a;
        }

        .active {
            background: #064e3b;
            color: #6ee7b7;
        }

        .failure {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .console {
            width: 100%;
            max-width: 960px;
            margin-top: 15px;
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 12px;
            overflow: hidden;
            font: 12px monospace;
        }

        .console-header {
            background: #111827;
            padding: 8px 15px;
            color: #9ca3af;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
        }

        .console-header button {
            background: transparent;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-family: monospace;
        }

        .console-body {
            padding: 12px 15px;
            height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-line {
            line-height: 1.4;
            word-break: break-all;
        }

        .info {
            color: #38bdf8;
        }

        .success {
            color: #34d399;
        }

        .warn {
            color: #fbbf24;
        }

        .error {
            color: #f87171;
        }
    </style>
</head>

<body>

<div class="player-wrapper">

    <div class="header">
        <span>ENGINE: SHAKA STREAM PIPELINE</span>
        <span>MODE: STATIC MPD</span>
    </div>

    <video
        id="video"
        controls
        autoplay
        playsinline>
    </video>

    <div class="telemetry">
        <span id="meta" class="meta">
            Initializing player...
        </span>

        <span id="status" class="status initializing">
            INITIALIZING
        </span>
    </div>

</div>


<div class="console">

    <div class="console-header">
        <span>LIVE TELEMETRY</span>

        <button onclick="
            document.getElementById('consoleBody').innerHTML = '';
        ">
            Clear [X]
        </button>
    </div>

    <div id="consoleBody" class="console-body">

        <div class="log-line info">
            [SYSTEM] Player ready.
        </div>

    </div>

</div>


<script>

/*
============================================================
EMBEDDED STREAM
============================================================
*/

const STREAM_URL =
"https://d1d34p8vz63oiq.cloudfront.net/ab0bd9e0-6f92-4e64-8bd8-598b5466ba14/master.mpd?Signature=NFB7TA3sp17zCTkdlhWOsCRLw1C0fenvzT0uBqJBu0C6SGrwUKFFjDpRn1zjCkgpsf12sc7p7QNeTaXqEQD~LxYkvmTiE2aF56GPMVi5bf3P6exhxrgZwklspYR9A3YPYdnkQxdRQIDSrN9-sRmGgHJmzdP8ahoD960Uo1Kj8PYJQRhM4kmPRGOcD7MVzZgYjK3XV-7tdDjwXMuEucMTisUGSCzEOBAXgoLVMk20yXuQTiC2h0zcDv9HP2ErL71ZnpaiRuCq8SgS2a27zE8~rf7eT2gyT0cHYc78B~LY3i4X7j8nMlHTnUVPj3VQb0Mr-ZNA1R7H3q0dqABkia8vZQ__&Key-Pair-Id=APKAXVKMENFCRKTG5XE2&Policy=eyJTdGF0ZW1lbnQiOlt7IlJlc291cmNlIjoiaHR0cHM6Ly9kMWQzNHA4dno2M29pcS5jbG91ZGZyb250Lm5ldC9hYjBiZDllMC02ZjkyLTRlNjQtOGJkOC01OThiNTQ2NmJhMTQvKiIsIkNvbmRpdGlvbiI6eyJEYXRlTGVzc1RoYW4iOnsiQVdTOkVwb2NoVGltZSI6MTc4OTEzMDkzOH0sIkRhdGVHcmVhdGVyVGhhbiI6eyJBV1M6RXBvY2hUaW1lIjo5NzU3Mjc5NzZ9fX1dfQ__";


/*
============================================================
EMBEDDED CLEARKEY
============================================================

KID:
03f80062cf40355260e39b3a6dded2b5

KEY:
c58eb1419a363838bad4e7f7cba75a9d
*/

const CLEAR_KEYS = {
    "03f80062cf40355260e39b3a6dded2b5":
    "c58eb1419a363838bad4e7f7cba75a9d"
};


/*
============================================================
LOGGING
============================================================
*/

function log(message, type = "info") {

    const body =
        document.getElementById("consoleBody");

    const line =
        document.createElement("div");

    const time =
        new Date().toLocaleTimeString();

    line.className =
        `log-line ${type}`;

    line.textContent =
        `[${time}] ${message}`;

    body.appendChild(line);

    body.scrollTop =
        body.scrollHeight;
}


/*
============================================================
STATUS
============================================================
*/

function setStatus(text, type) {

    const status =
        document.getElementById("status");

    status.textContent = text;

    status.className =
        `status ${type}`;
}


/*
============================================================
PLAYER
============================================================
*/

async function initializePlayer() {

    const video =
        document.getElementById("video");

    const meta =
        document.getElementById("meta");


    try {

        log(
            "Installing Shaka polyfills...",
            "info"
        );

        shaka.polyfill.installAll();


        if (!shaka.Player.isBrowserSupported()) {

            throw new Error(
                "This browser is not supported by Shaka Player."
            );
        }


        /*
        ========================================================
        CREATE PLAYER
        ========================================================
        */

        const player =
            new shaka.Player(video);


        /*
        ========================================================
        CLEARKEY
        ========================================================
        */

        player.configure({

            drm: {

                clearKeys: CLEAR_KEYS

            }

        });


        log(
            "ClearKey DRM configured.",
            "success"
        );


        /*
        ========================================================
        GET MPD PARAMETERS
        ========================================================
        */

        const mpdURL =
            new URL(STREAM_URL);

        const mpdParameters =
            new URLSearchParams(
                mpdURL.search
            );


        log(
            "Master MPD parameters detected.",
            "success"
        );


        log(
            "Parameters: " +
            [...mpdParameters.keys()].join(", "),
            "info"
        );


        /*
        ========================================================
        SEGMENT REQUEST FILTER
        ========================================================
        */

        const networkingEngine =
            player.getNetworkingEngine();


        networkingEngine.registerRequestFilter(
            (type, request) => {

                /*
                Leave the master MPD untouched.
                */

                if (
                    type ===
                    shaka.net.NetworkingEngine.RequestType.MANIFEST
                ) {
                    return;
                }


                /*
                Apply the same query parameters
                to media requests.
                */

                request.uris =
                    request.uris.map(uri => {

                        try {

                            const url =
                                new URL(uri);


                            for (
                                const [
                                    name,
                                    value
                                ]
                                of mpdParameters.entries()
                            ) {

                                url.searchParams.set(
                                    name,
                                    value
                                );

                            }


                            return url.toString();

                        } catch (error) {

                            log(
                                "Could not modify segment URL: " +
                                error.message,
                                "warn"
                            );

                            return uri;
                        }

                    });

            }
        );


        log(
            "MPD authentication parameters attached to media requests.",
            "success"
        );


        /*
        ========================================================
        ERROR HANDLER
        ========================================================
        */

        player.addEventListener(
            "error",
            event => {

                const error =
                    event.detail;

                log(
                    `Shaka error ${error.code}: ${
                        JSON.stringify(error)
                    }`,
                    "error"
                );

                setStatus(
                    `ERROR_${error.code}`,
                    "failure"
                );

            }
        );


        /*
        ========================================================
        LOAD STREAM
        ========================================================
        */

        meta.textContent =
            "Loading CloudFront MPD...";

        setStatus(
            "LOADING",
            "initializing"
        );


        log(
            "Loading master.mpd...",
            "info"
        );


        await player.load(
            STREAM_URL
        );


        /*
        ========================================================
        SUCCESS
        ========================================================
        */

        meta.textContent =
            "CloudFront DASH stream active";


        setStatus(
            "STREAM_ACTIVE",
            "active"
        );


        log(
            "Manifest loaded successfully.",
            "success"
        );


        /*
        ========================================================
        AUTOPLAY
        ========================================================
        */

        try {

            await video.play();

            log(
                "Playback started.",
                "success"
            );

        } catch (error) {

            log(
                "Autoplay blocked. Press Play.",
                "warn"
            );

        }


    } catch (error) {

        console.error(error);


        setStatus(
            "SYSTEM_FAULT",
            "failure"
        );


        document.getElementById("meta").textContent =
            error.message;


        log(
            `Fatal error: ${error.message}`,
            "error"
        );

    }
}


/*
============================================================
START
============================================================
*/

document.addEventListener(
    "DOMContentLoaded",
    initializePlayer
);

</script>

</body>
</html>
