<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCoderZ Secure Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .player-wrapper {
            width: 100%;
            max-width: 960px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
        }
        .architectural-header {
            background: #1f2937;
            padding: 12px 20px;
            font-size: 12px;
            font-family: monospace;
            color: #38bdf8;
            border-bottom: 1px solid #374151;
            display: flex;
            justify-content: space-between;
        }
        video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
        .telemetry-bar {
            padding: 16px 20px;
            font-size: 13px;
            background: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stream-meta { color: #9ca3af; font-family: monospace; }
        .node-status { font-weight: 600; padding: 4px 10px; border-radius: 6px; font-size: 12px; }
        .node-status.initializing { background: #78350f; color: #fde68a; }
        .node-status.active { background: #064e3b; color: #6ee7b7; }
        .node-status.failure { background: #7f1d1d; color: #fca5a5; }

        .debug-console {
            width: 100%;
            max-width: 960px;
            margin-top: 15px;
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 12px;
            overflow: hidden;
            font-family: monospace;
            font-size: 12px;
        }
        .console-header {
            background: #111827;
            padding: 8px 15px;
            color: #9ca3af;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
        }
        .console-body {
            padding: 12px 15px;
            height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .log-line { line-height: 1.4; word-break: break-all; }
        .log-info { color: #38bdf8; }
        .log-success { color: #34d399; }
        .log-error { color: #f87171; }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <div class="architectural-header">
            <span>ENGINE: DELTA STREAM PIPELINE [ACTIVE]</span>
            <span>MODE: BUNNYCDN DIRECT DASH</span>
        </div>
        <video id="quantumVideoElement" controls autoplay playsinline></video>
        <div class="telemetry-bar">
            <span id="streamMetaText" class="stream-meta">Initializing Pipeline...</span>
            <span id="nodeStatusBadge" class="node-status initializing">SYNCHRONIZING</span>
        </div>
    </div>

    <div class="debug-console">
        <div class="console-header">
            <span>LIVE TELEMETRY & DEBUG CONSOLE</span>
            <button onclick="document.getElementById('consoleBody').innerHTML='';" style="background:transparent; border:none; color:#9ca3af; cursor:pointer; font-family:monospace;">Clear [X]</button>
        </div>
        <div id="consoleBody" class="console-body">
            <div class="log-line log-info">[SYSTEM] Console ready.</div>
        </div>
    </div>

    <script>
        function logDebug(message, type = 'info') {
            const consoleBody = document.getElementById('consoleBody');
            const timestamp = new Date().toLocaleTimeString();
            const logElement = document.createElement('div');
            logElement.className = `log-line log-${type}`;
            logElement.textContent = `[${timestamp}] ${message}`;
            consoleBody.appendChild(logElement);
            consoleBody.scrollTop = consoleBody.scrollHeight;
        }

        document.addEventListener('DOMContentLoaded', initializePlayerPipeline);

        async function initializePlayerPipeline() {
            const videoElement = document.getElementById('quantumVideoElement');
            const streamMetaText = document.getElementById('streamMetaText');
            const nodeStatusBadge = document.getElementById('nodeStatusBadge');

            const urlParams = new URLSearchParams(window.location.search);
            const batchId = urlParams.get('batchId');
            const subjectId = urlParams.get('subjectId');
            const lectureId = urlParams.get('lectureId') || urlParams.get('scheduleId');
            const key = urlParams.get('key');

            if (!batchId || !lectureId) {
                nodeStatusBadge.textContent = "PARAMS_MISSING";
                nodeStatusBadge.className = "node-status failure";
                streamMetaText.textContent = "Error: batchId or lectureId is missing.";
                logDebug("Validation Failed: Missing parameters.", "error");
                return;
            }

            const apiEndpoint = `https://examcrushers.in/api/video?batchId=${batchId}&subjectId=${subjectId || 'hehe'}&lectureId=${lectureId}&key=${key || 'Sharma'}`;

            try {
                streamMetaText.textContent = "Fetching stream URL from Worker...";
                logDebug(`Requesting API: ${apiEndpoint}`, "info");

                const response = await fetch(apiEndpoint);
                const payload = await response.json();

                if (!payload.success || !payload.url) {
                    throw new Error(payload.error || "Failed to retrieve stream URL.");
                }

                const streamUrl = payload.url;
                logDebug("Stream URL received successfully.", "success");

                streamMetaText.textContent = "Initializing Shaka Player...";
                shaka.polyfill.installAll();
                if (!shaka.Player.isBrowserSupported()) {
                    throw new Error('Browser environment incompatible with Shaka Player.');
                }

                const player = new shaka.Player(videoElement);

                player.addEventListener('error', (event) => {
                    logDebug(`Playback Error [${event.detail.code}]: ${JSON.stringify(event.detail)}`, "error");
                    nodeStatusBadge.textContent = `ERROR_${event.detail.code}`;
                    nodeStatusBadge.className = "node-status failure";
                });

                logDebug("Loading manifest into Shaka Player...", "info");
                await player.load(streamUrl);

                nodeStatusBadge.textContent = "STREAM_ACTIVE";
                nodeStatusBadge.className = "node-status active";
                streamMetaText.textContent = `Streaming Node: ${lectureId}`;
                logDebug("Stream loaded and playing successfully!", "success");

            } catch (err) {
                logDebug(`Exception: ${err.message}`, "error");
                nodeStatusBadge.textContent = "SYSTEM_FAULT";
                nodeStatusBadge.className = "node-status failure";
                streamMetaText.textContent = err.message;
            }
        }
    </script>
</body>
</html>
