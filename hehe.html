<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>HLS Stream Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: Arial, sans-serif;
            color: #fff;
            padding: 20px;
        }
        #container {
            width: 100%;
            max-width: 900px;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        video { 
            width: 100%; 
            border-radius: 8px;
            background: #111;
            aspect-ratio: 16/9;
        }
        #status {
            color: #4fc3f7;
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
            min-height: 24px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button, input {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        input {
            flex: 1;
            min-width: 250px;
            cursor: text;
        }
        input:focus { border-color: #4fc3f7; outline: none; }
        button:hover { background: #3a3a3a; border-color: #4fc3f7; }
        .error { color: #ff6b6b; }
        .success { color: #69db7c; }
    </style>
</head>
<body>
    <div id="container">
        <video id="video" controls playsinline></video>
        <div id="status">🔄 Initializing player...</div>
        <div class="controls">
            <input type="text" id="apiUrlInput" placeholder="Enter API URL..." />
            <button onclick="handleManualPlay()">▶ Play</button>
            <button onclick="loadFromUrlParams()">🔄 Reload</button>
            <button onclick="retryWithProxy()">🔁 Try Proxy Mode</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        const apiUrlInput = document.getElementById('apiUrlInput');

        let hls = null;
        let currentStreamUrl = '';
        let usingProxy = false;

        function setStatus(msg, type = 'info') {
            status.innerHTML = msg;
            status.className = type;
        }

        function destroyHLS() {
            if (hls) {
                hls.destroy();
                hls = null;
            }
            video.removeAttribute('src');
            video.load();
        }

        async function fetchAndPlay(apiUrl) {
            destroyHLS();
            setStatus('🔄 Fetching stream data from API...', 'info');

            try {
                const res = await fetch(apiUrl);
                const data = await res.json();
                
                if (data.success && data.url) {
                    currentStreamUrl = data.url;
                    usingProxy = false;
                    loadStream(currentStreamUrl);
                } else {
                    throw new Error(data.error || 'Invalid API response structure');
                }
            } catch (err) {
                setStatus('❌ API Error: ' + err.message, 'error');
            }
        }

        function loadFromUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const batchId = urlParams.get('batchId');
            const subjectId = urlParams.get('subjectId') || 'hehe';
            const lectureId = urlParams.get('lectureId') || urlParams.get('scheduleId');

            if (batchId && lectureId) {
                const apiUrl = `https://examcrushers.in/api/play?batchId=${batchId}&subjectId=${subjectId}&lectureId=${lectureId}`;
                apiUrlInput.value = apiUrl;
                fetchAndPlay(apiUrl);
            } else {
                setStatus('⚠️ Missing URL parameters. Please use format: ?batchId=...&subjectId=...&lectureId=...', 'info');
            }
        }

        function handleManualPlay() {
            const inputVal = apiUrlInput.value.trim();
            if (!inputVal) {
                setStatus('❌ Please enter a valid API URL', 'error');
                return;
            }
            fetchAndPlay(inputVal);
        }

        function loadStream(url) {
            destroyHLS();
            setStatus('🔄 Loading stream...', 'info');
            
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                setStatus('📺 Playing with native HLS (Safari)', 'success');
                return;
            }

            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    xhrSetup: function(xhr, reqUrl) {
                        xhr.withCredentials = false;
                        xhr.setRequestHeader('Origin', window.location.origin);
                    }
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        setStatus('❌ Fatal error: ' + data.type, 'error');
                        if (data.type === 'networkError' && !usingProxy) {
                            setStatus('🔄 Network/CORS error - trying proxy mode...', 'info');
                            retryWithProxy();
                        }
                    } else {
                        setStatus('⚠️ Non-fatal error: ' + data.type, 'error');
                    }
                });

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    setStatus('✅ Stream loaded successfully!', 'success');
                    video.play().catch(e => console.log('Autoplay blocked'));
                });

                hls.attachMedia(video);
                hls.loadSource(url);
            } else {
                setStatus('❌ HLS not supported in this browser', 'error');
            }
        }

        function retryWithProxy() {
            if (!currentStreamUrl) {
                setStatus('❌ No active stream URL to proxy', 'error');
                return;
            }
            
            destroyHLS();
            usingProxy = true;
            setStatus('🔄 Trying CORS proxy mode...', 'info');
            
            const proxyUrl = 'https://cors-anywhere.herokuapp.com/' + currentStreamUrl;
            
            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    xhrSetup: function(xhr, reqUrl) {
                        xhr.withCredentials = false;
                    }
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        setStatus('❌ Proxy also failed. Stream may be expired.', 'error');
                    }
                });

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    setStatus('✅ Stream loaded via proxy!', 'success');
                    video.play().catch(e => console.log('Autoplay blocked'));
                });

                hls.attachMedia(video);
                hls.loadSource(proxyUrl);
            }
        }

        window.addEventListener('load', loadFromUrlParams);
    </script>
</body>
</html>
