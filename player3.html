<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .crop-frame {
            clip-path: inset(50px 0px 0px 0px);
            width: 100%;
            height: calc(100% + 50px);
            position: absolute;
            top: -50px;
        }
        :fullscreen .crop-frame {
            clip-path: none;
            height: 100%;
            top: 0;
        }
    </style>
</head>
<body class="bg-black fixed inset-0 w-screen h-screen overflow-hidden flex flex-col m-0 p-0">
    <div id="playerContainer" class="relative w-full flex-1 bg-black overflow-hidden">
        <iframe 
            id="marcoPlayer"
            src="" 
            class="crop-frame border-none m-0 p-0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>
    <script>
        const pathQuery = window.location.search.replace('?', '');
        const parts = pathQuery.split('/');
        if (parts.length >= 3) {
            const batchId = parts[0];
            const subjectId = parts[1];
            const videoId = parts[2];
            const marcoUrl = `https://marco-player.pages.dev/player/api/${batchId}/${subjectId}/${videoId}/marco-player`;
            document.getElementById('marcoPlayer').src = marcoUrl;
        } else {
            document.body.innerHTML = '<div class="text-white flex items-center justify-center h-full font-bold">Invalid Video Parameters!</div>';
        }
    </script>
</body>
</html>
