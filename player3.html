<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #playerContainer {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #marcoPlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Yeh hai wo jaadui overlay jo button chhupayega */
        .back-button-blocker {
            position: absolute;
            top: 0;
            left: 0;
            /* Button jitni height aur width yahan set karein (approx 50px) */
            width: 100%; 
            height: 50px; 
            background-color: black; /* Ya transparent agar video ke upar rakhna ho */
            z-index: 10; /* Iframe ke upar rahega */
            pointer-events: auto; /* Click block karega */
        }

        /* Fullscreen hone par blocker ko hata dein */
        :fullscreen .back-button-blocker {
            display: none;
        }
        /* Android fullscreen fix */
        :-webkit-full-screen .back-button-blocker {
            display: none;
        }
    </style>
</head>
<body class="bg-black fixed inset-0 w-screen h-screen overflow-hidden flex flex-col m-0 p-0">
    <div id="playerContainer">
        <!-- Yeh wo div hai jo back button wale area ko dhak lega -->
        <div class="back-button-blocker"></div>
        
        <iframe 
            id="marcoPlayer"
            src="" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>
    <script>
        const pathQuery = window.location.search.replace('?', '');
        const parts = pathQuery.split('/');
        if (parts.length >= 3) {
            const batchId = parts[0];
            const subjectId = parts[1];
            const videoId = parts[2];
            const marcoUrl = `https://marco-player.pages.dev/player/api/${batchId}/${subjectId}/${videoId}/marco-player`;
            document.getElementById('marcoPlayer').src = marcoUrl;
        } else {
            document.body.innerHTML = '<div class="text-white flex items-center justify-center h-full font-bold">Invalid Video Parameters!</div>';
        }
    </script>
</body>
</html>
