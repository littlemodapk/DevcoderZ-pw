<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DevCoderz Ultra Secure Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}
.app-container{position:relative;width:100%;height:100%;background:#000;overflow:hidden}
.player{position:relative;width:100%;height:100%;background:#000}
video{width:100%;height:100%;object-fit:contain;background:#000}
.top-brand{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:40;text-align:center;pointer-events:none}.top-brand .jsr{color:#ff9800;font-weight:700;font-size:13px}.top-brand .dev{margin-top:2px;font-size:11px;font-weight:600;color:#00e5ff;text-shadow:0 0 6px #00e5ff}
.center-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;cursor:pointer}.center-play.hide{display:none}.center-play span{width:70px;height:70px;background:rgba(0,0,0,.6);border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;box-shadow:0 0 15px rgba(0,0,0,.5)}
.controls{position:absolute;bottom:0;width:100%;padding:15px;background:linear-gradient(transparent,rgba(0,0,0,.85));transition:.3s;z-index:35}.controls.hide{transform:translateY(100%);opacity:0}
.progress{height:6px;background:rgba(255,255,255,.3);border-radius:3px;position:relative;margin-bottom:8px;cursor:pointer}.progress-fill{height:100%;width:0;background:#ff9800;border-radius:3px;pointer-events:none}.thumb{position:absolute;top:50%;width:14px;height:14px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);left:0;pointer-events:none}
.time{color:#fff;font-size:11px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;color:#fff}
.btn{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#play{font-size:22px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:100}
.box{width:320px;padding:26px;border-radius:22px;text-align:center;background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff}
.tg-btn{display:block;margin-top:14px;padding:14px;border-radius:28px;font-weight:700;width:100%;cursor:pointer;text-align:center;text-decoration:none;color:#fff}
.join{background:#fff;color:#1e3c72}.continue{background:rgba(0,0,0,.25);border:1px solid #fff}
#status{position:absolute;top:15px;left:15px;color:#4fc3f7;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:4px;font-size:11px;z-index:50;display:none}
.menu-container{position:absolute;top:15px;right:15px;z-index:60}
.dot-btn{background:rgba(0,0,0,.6);border:none;color:#fff;font-size:20px;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dropdown-menu{display:none;position:absolute;right:0;top:40px;background:#1c1c1c;border:1px solid #333;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.8);width:160px;overflow:hidden}
.dropdown-menu.active{display:block}
.dropdown-item{padding:12px 16px;font-size:13px;color:#fff;cursor:pointer;border-bottom:1px solid #2a2a2a}
.dropdown-item:hover{background:#333}
#sidebar{position:fixed;top:0;right:-100%;width:100%;height:100%;background:#111;transition:right .3s ease;z-index:200;display:flex;flex-direction:column}
#sidebar.active{right:0}
@media(min-width:600px){#sidebar{width:400px;right:-400px;}}
.sidebar-header{padding:15px;background:#1a1a1a;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;color:#fff;font-weight:bold}
.close-sidebar{background:none;border:none;color:#aaa;font-size:20px;cursor:pointer}
.sidebar-tabs{display:flex;background:#181818;border-bottom:1px solid #333}
.tab-btn{flex:1;padding:12px;text-align:center;color:#aaa;font-size:13px;font-weight:bold;cursor:pointer;border-bottom:2px solid transparent}
.tab-btn.active{color:#4fc3f7;border-bottom-color:#4fc3f7;background:#222}
.tab-content{flex:1;overflow-y:auto;padding:15px;display:none;flex-direction:column;gap:10px}
.tab-content.active{display:flex}
.slide-item{background:#181818;border-radius:8px;overflow:hidden;border:1px solid #333;cursor:pointer}
.slide-item img{width:100%;display:block}
.attachment-item{background:#181818;padding:12px;border-radius:8px;border:1px solid #333;color:#fff;display:flex;justify-content:space-between;align-items:center;text-decoration:none}
.no-data-text{color:#888;text-align:center;padding:20px;font-size:13px}
</style>
</head>
<body>

<div class="overlay" id="tgPopup">
 <div class="box">
  <h2>Join our Telegram</h2>
  <a class="tg-btn join" href="https://t.me/+JXdxtVzQf-NhM2Jl" target="_blank">Join Telegram</a>
  <div class="tg-btn continue" id="continueBtn">Continue to Video</div>
 </div>
</div>

<div class="app-container">
    <div class="player" id="player">
     <div id="status">🔄 Initializing...</div>

     <div class="menu-container">
        <button class="dot-btn" id="dotMenuBtn">⋮</button>
        <div class="dropdown-menu" id="dropdownMenu">
            <div class="dropdown-item" id="openSidebarMenuBtn">Lecture Notes/Slides</div>
        </div>
     </div>

     <video id="video" playsinline></video>
     
     <div class="top-brand">
      <div class="jsr">🚩 Jai Shree Ram 🚩</div>
      <div class="dev">Developed by - Devansh Sharma</div>
     </div>
     
     <div class="center-play hide" id="centerPlay"><span>▶</span></div>
     
     <div class="controls hide" id="controls">
      <div class="progress" id="progress"><div class="progress-fill" id="bar"></div><div class="thumb" id="thumb"></div></div>
      <div class="time" id="time">00:00 / 00:00</div>
      <div class="row">
       <div style="display:flex;gap:15px;align-items:center;">
        <button class="btn" id="play">▶</button>
        <button class="btn" id="back">⟲ 10s</button>
        <button class="btn" id="fwd">10s ⟳</button>
       </div>
       <button class="btn" id="fs">⛶</button>
      </div>
     </div>
    </div>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <span>Study Material</span>
        <button class="close-sidebar" id="closeSidebarBtn">✕</button>
    </div>
    <div class="sidebar-tabs">
        <div class="tab-btn active" data-target="slidesTabContent">Slides</div>
        <div class="tab-btn" data-target="attachmentsTabContent">Attachments</div>
    </div>
    <div class="tab-content active" id="slidesTabContent">
        <div id="slideList"><div class="no-data-text">Loading slides...</div></div>
    </div>
    <div class="tab-content" id="attachmentsTabContent">
        <div id="attachmentsList"><div class="no-data-text">No attachments available.</div></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const playerElem = document.getElementById('player');
const videoElem = document.getElementById('video');
const playButton = document.getElementById('play');
const backButton = document.getElementById('back');
const fwdButton = document.getElementById('fwd');
const fsButton = document.getElementById('fs');
const controlsElem = document.getElementById('controls');
const centerPlayElem = document.getElementById('centerPlay');
const progressElem = document.getElementById('progress');
const barElem = document.getElementById('bar');
const thumbElem = document.getElementById('thumb');
const tgPopupElem = document.getElementById('tgPopup');
const continueBtn = document.getElementById('continueBtn');
const timeDisplayElem = document.getElementById('time');
const statusElem = document.getElementById('status');
const dotMenuBtn = document.getElementById('dotMenuBtn');
const dropdownMenuElem = document.getElementById('dropdownMenu');
const openSidebarMenuBtn = document.getElementById('openSidebarMenuBtn');
const sidebarElem = document.getElementById('sidebar');
const closeSidebarBtn = document.getElementById('closeSidebarBtn');
const slideListElem = document.getElementById('slideList');
const attachmentsListElem = document.getElementById('attachmentsList');

let isDragging = false, hideTimeoutRef, hlsInstance, wasVideoPlaying = false;

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.getAttribute('data-target')).classList.add('active');
    };
});

if (continueBtn) {
    continueBtn.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (tgPopupElem) tgPopupElem.style.display = "none";
        if (centerPlayElem) centerPlayElem.classList.remove("hide");
        if (controlsElem) {
            controlsElem.classList.remove("hide");
            clearTimeout(hideTimeoutRef);
            hideTimeoutRef = setTimeout(() => controlsElem.classList.add("hide"), 3000);
        }
    };
}

function updateStatusText(msg) {
    if (!statusElem) return;
    statusElem.innerText = msg;
    statusElem.style.display = "block";
    setTimeout(() => { statusElem.style.display = 'none'; }, 3000);
}

if (dotMenuBtn) {
    dotMenuBtn.onclick = (e) => {
        e.stopPropagation();
        dropdownMenuElem.classList.toggle('active');
    };
}

if (openSidebarMenuBtn) {
    openSidebarMenuBtn.onclick = (e) => {
        e.stopPropagation();
        dropdownMenuElem.classList.remove('active');
        sidebarElem.classList.add('active');
    };
}

if (closeSidebarBtn) {
    closeSidebarBtn.onclick = (e) => {
        e.stopPropagation();
        sidebarElem.classList.remove('active');
    };
}

window.addEventListener('click', () => { 
    if (dropdownMenuElem) dropdownMenuElem.classList.remove('active'); 
});

const urlParamsExtractor = new URLSearchParams(location.search);
const rawUrlParam = urlParamsExtractor.get("url") || urlParamsExtractor.get("m3u8Url") || urlParamsExtractor.get("Url");

async function initializePlayerEngine() {
    let resolvedStreamUrl = "";
    
    if (rawUrlParam) {
        let decodedUrl = decodeURIComponent(rawUrlParam);
        if (decodedUrl.startsWith("https://examcrushers.in/api/play?url=")) {
            resolvedStreamUrl = decodedUrl;
        } else {
            resolvedStreamUrl = "https://examcrushers.in/api/play?url=" + encodeURIComponent(decodedUrl);
        }
    } else {
        updateStatusText('❌ Missing url parameter!');
        slideListElem.innerHTML = `<div class="no-data-text">Missing url parameter.</div>`;
        return;
    }

    setupHlsPlayer(resolvedStreamUrl);
}

function setupHlsPlayer(url) {
    updateStatusText('🔄 Loading stream...');

    if (videoElem.canPlayType('application/vnd.apple.mpegurl')) {
        videoElem.src = url;
        videoElem.addEventListener('loadedmetadata', () => {
            updateStatusText('✅ Ready');
        });
    } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(videoElem);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            updateStatusText('✅ Ready');
        });

        hlsInstance.on(Hls.Events.ERROR, (ev, data) => {
            if (data.fatal) {
                switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR: hlsInstance.startLoad(); break;
                    case Hls.ErrorTypes.MEDIA_ERROR: hlsInstance.recoverMediaError(); break;
                    default: hlsInstance.destroy(); updateStatusText('❌ Stream error'); break;
                }
            }
        });
    } else {
        updateStatusText('❌ Unsupported browser');
    }
}

window.addEventListener('load', () => {
    setTimeout(initializePlayerEngine, 300);
});

function formatTimestamp(sec) {
    if (!sec || isNaN(sec)) return "00:00";
    let m = Math.floor(sec / 60);
    let s = Math.floor(sec % 60);
    return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function refreshProgressBarUI(pct, curr, dur) {
    if (!barElem || !thumbElem || !timeDisplayElem) return;
    barElem.style.width = pct + "%";
    thumbElem.style.left = pct + "%";
    timeDisplayElem.innerText = `${formatTimestamp(curr)} / ${formatTimestamp(dur)}`;
}

function triggerSafePlayback() {
    videoElem.play().catch(() => {
        videoElem.muted = true;
        videoElem.play();
    });
}

function handleControlVisibility(permanent = false) {
    if (!controlsElem) return;
    controlsElem.classList.remove("hide");
    clearTimeout(hideTimeoutRef);
    if (!permanent) {
        hideTimeoutRef = setTimeout(() => controlsElem.classList.add("hide"), 3000);
    }
}

if (centerPlayElem) {
    centerPlayElem.onclick = e => {
        e.preventDefault();
        e.stopPropagation();
        triggerSafePlayback();
    };
}

if (playButton) {
    playButton.onclick = e => {
        e.preventDefault();
        e.stopPropagation();
        videoElem.paused ? triggerSafePlayback() : videoElem.pause();
    };
}

if (backButton) {
    backButton.onclick = e => {
        e.preventDefault();
        e.stopPropagation();
        videoElem.currentTime = Math.max(0, videoElem.currentTime - 10);
        handleControlVisibility(true);
    };
}

if (fwdButton) {
    fwdButton.onclick = e => {
        e.preventDefault();
        e.stopPropagation();
        videoElem.currentTime = Math.min(videoElem.duration, videoElem.currentTime + 10);
        handleControlVisibility(true);
    };
}

if (fsButton) {
    fsButton.onclick = async e => {
        e.preventDefault();
        e.stopPropagation();
        try {
            if (!document.fullscreenElement) {
                await document.documentElement.requestFullscreen();
            } else {
                await document.exitFullscreen();
            }
        } catch (err) {}
    };
}

function extractPointerPosition(e) {
    const rect = progressElem.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let calcPos = (clientX - rect.left) / rect.width;
    return Math.max(0, Math.min(1, calcPos));
}

if (progressElem) {
    progressElem.onpointerdown = e => {
        e.preventDefault();
        e.stopPropagation();
        isDragging = true;
        wasVideoPlaying = !videoElem.paused;
        videoElem.pause();
        progressElem.setPointerCapture(e.pointerId);
        let pos = extractPointerPosition(e);
        if (videoElem.duration) {
            videoElem.currentTime = pos * videoElem.duration;
            refreshProgressBarUI(pos * 100, videoElem.currentTime, videoElem.duration);
        }
    };

    progressElem.onpointermove = e => {
        if (!isDragging) return;
        e.preventDefault();
        e.stopPropagation();
        let pos = extractPointerPosition(e);
        if (videoElem.duration) {
            videoElem.currentTime = pos * videoElem.duration;
            refreshProgressBarUI(pos * 100, videoElem.currentTime, videoElem.duration);
        }
    };

    progressElem.onpointerup = e => {
        if (!isDragging) return;
        e.preventDefault();
        e.stopPropagation();
        isDragging = false;
        try { progressElem.releasePointerCapture(e.pointerId); } catch(err) {}
        if (wasVideoPlaying) { triggerSafePlayback(); }
    };
}

videoElem.ontimeupdate = () => {
    if (!isDragging && videoElem.duration) {
        refreshProgressBarUI((videoElem.currentTime / videoElem.duration) * 100, videoElem.currentTime, videoElem.duration);
    }
};

videoElem.onloadedmetadata = () => {
    if (videoElem.duration) {
        refreshProgressBarUI(0, videoElem.currentTime, videoElem.duration);
    }
};

videoElem.onplay = () => {
    if (playButton) playButton.innerText = "❚❚";
    if (centerPlayElem) centerPlayElem.classList.add("hide");
    handleControlVisibility();
};

videoElem.onpause = () => {
    if (playButton) playButton.innerText = "▶";
    handleControlVisibility(true);
};

playerElem.onclick = e => {
    if (tgPopupElem && tgPopupElem.style.display !== "none") return;
    if (e.target === videoElem || e.target === playerElem) {
        sidebarElem.classList.remove('active');
        if (controlsElem.classList.contains("hide")) {
            handleControlVisibility();
        } else {
            controlsElem.classList.add("hide");
            clearTimeout(hideTimeoutRef);
        }
    }
};
</script>
</body>
</html>
