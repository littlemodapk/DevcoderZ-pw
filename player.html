<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DevCoderz Ultra Secure Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}

.player{position:relative;width:100%;height:50vh;background:#000;pointer-events:auto;touch-action:manipulation}
@media(min-width:768px){.player{height:60vh;}}

video{width:100%;height:100%;object-fit:contain;background:#000}
.top-brand{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:40;text-align:center;pointer-events:none}.top-brand .jsr{color:#ff9800;font-weight:700;font-size:14px}.top-brand .dev{margin-top:4px;font-size:12px;font-weight:600;color:#00e5ff;text-shadow:0 0 6px #00e5ff, 0 0 12px #00e5ff}

.center-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;cursor:pointer}.center-play.hide{display:none}.center-play span{width:80px;height:80px;background:rgba(255,255,255,.25);backdrop-filter:blur(5px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:35px;color:#fff}

.controls{position:absolute;bottom:0;width:100%;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.9));transition:.3s;z-index:35;touch-action:none}.controls.hide{transform:translateY(100%);opacity:0}
.progress{height:7px;background:#555;border-radius:10px;position:relative;margin-bottom:6px;touch-action:none;cursor:pointer}.progress-fill{height:100%;width:0;background:#2196f3;border-radius:10px;pointer-events:none}.thumb{position:absolute;top:50%;width:18px;height:18px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);left:0;pointer-events:none}
.time{color:#fff;font-size:11px;text-align:right;margin-bottom:4px}
.row{display:flex;align-items:center;gap:6px;justify-content:space-between;color:#fff}
.btn{width:36px;height:36px;border:1.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
#play{font-size:0}#play::before{content:"▶";font-size:14px}#play.pause::before{content:"❚❚";font-size:12px}

.settings{position:absolute;bottom:65px;right:10px;background:#111;border-radius:12px;padding:12px;width:160px;display:none;z-index:50}
.settings label{color:#aaa;font-size:10px;display:block;margin-bottom:4px}
.settings select{width:100%;background:#000;color:#fff;border:1px solid #555;border-radius:4px;height:24px;margin-bottom:10px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100}
.box{width:320px;padding:26px;border-radius:22px;text-align:center;background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff}
.tg-btn{display:block;margin-top:14px;padding:14px;border-radius:28px;font-weight:700;width:100%;cursor:pointer;text-align:center;text-decoration:none;color:#fff}
.join{background:#fff;color:#1e3c72}.continue{background:rgba(0,0,0,.25);border:1px solid #fff}

#status{position:absolute;bottom:15px;left:15px;color:#4fc3f7;background:rgba(0,0,0,.8);padding:6px 12px;border-radius:6px;font-size:12px;z-index:50;pointer-events:none}

.menu-container{position:absolute;top:15px;right:20px;z-index:60}
.dot-btn{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dropdown-menu{display:none;position:absolute;right:0;top:45px;background:#1c1c1c;border:1px solid #333;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.8);width:140px;overflow:hidden}
.dropdown-menu.active{display:block}
.dropdown-item{padding:12px 16px;font-size:13px;color:#fff;cursor:pointer;border-bottom:1px solid #2a2a2a}
.dropdown-item:hover{background:#333}

/* Slides Sidebar Design - Badi Photo aur Niche Chhota Timer */
#sidebar{position:fixed;top:0;right:-100%;width:100%;height:100%;background:rgba(12,12,12,.98);backdrop-filter:blur(8px);transition:right .3s ease;z-index:70;display:flex;flex-direction:column;border-left:1px solid #333}
#sidebar.active{right:0}
@media(min-width:600px){#sidebar{width:420px;right:-420px;}}

.sidebar-header{padding:15px;background:#1a1a1a;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;color:#fff;font-weight:bold;font-size:16px}
.close-sidebar{background:none;border:none;color:#aaa;font-size:22px;cursor:pointer}
.close-sidebar:hover{color:#fff}

.slide-list{padding:15px;display:flex;flex-direction:column;gap:20px;overflow-y:auto;flex:1}
.slide-item{background:#161616;border-radius:12px;overflow:hidden;border:1px solid #333;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;padding:10px}
.slide-item:hover{border-color:#00e5ff;transform:translateY(-2px)}

/* Badi Image Styling */
.slide-item img{width:100%;max-height:260px;object-fit:contain;background:#000;border-radius:8px;display:block}

/* Slides ke niche chhota sa timer */
.slide-footer-info{width:100%;display:flex;justify-content:flex-end;align-items:center;margin-top:8px;padding-right:4px}
.slide-time-badge{background:rgba(0,229,255,0.15);color:#00e5ff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid rgba(0,229,255,0.3)}
.no-slide-text{color:#888;text-align:center;padding:40px;font-size:14px}
</style>
</head>
<body>

<div class="overlay" id="tgPopup">
 <div class="box">
  <h2>Join our Telegram</h2>
  <a class="tg-btn join" href="https://t.me/+JXdxtVzQf-NhM2Jl" target="_blank">Join Telegram</a>
  <div class="tg-btn continue" id="continueBtn">Continue to Video</div>
 </div>
</div>

<div class="player" id="player">
 <div id="status">🔄 Initializing...</div>

 <div class="menu-container">
    <button class="dot-btn" id="dotMenuBtn">⋮</button>
    <div class="dropdown-menu" id="dropdownMenu">
        <div class="dropdown-item" id="notesItem">📄 Notes</div>
        <div class="dropdown-item" id="slidesItem">🖼️ Slides</div>
        <div class="dropdown-item" id="downloadItem">📥 Download</div>
    </div>
 </div>

 <video id="video" playsinline></video>
 
 <div class="top-brand">
  <div class="jsr">🚩 Jai Shree Ram 🚩</div>
  <div class="dev">Developed by - Devansh Sharma</div>
 </div>
 
 <div class="center-play hide" id="centerPlay"><span>▶</span></div>
 
 <div class="controls hide" id="controls">
  <div class="progress" id="progress"><div class="progress-fill" id="bar"></div><div class="thumb" id="thumb"></div></div>
  <div class="time" id="time">00:00:00 / 00:00:00</div>
  <div class="row">
   <div class="btn" id="back">⟲10</div>
   <div class="btn" id="play"></div>
   <div class="btn" id="fwd">10⟳</div>
   <div class="btn" id="settingsBtn">⚙️</div>
   <div class="btn" id="fs">⛶</div>
  </div>
 </div>
 
 <div class="settings" id="settings">
  <label>Speed</label>
  <select id="speed">
   <option value="1" selected>1x</option>
   <option value="1.25">1.25x</option>
   <option value="1.5">1.5x</option>
   <option value="1.75">1.75x</option>
   <option value="2">2x</option>
   <option value="2.25">2.25x</option>
   <option value="2.5">2.5x</option>
   <option value="2.75">2.75x</option>
  </select>
  <label>Quality</label>
  <select id="quality"><option value="-1">AUTO</option></select>
 </div>
</div>

<!-- Lecture Slides Sidebar (Badi Photos + Niche Timer) -->
<div id="sidebar">
    <div class="sidebar-header">
        <span>Lecture Slides</span>
        <button class="close-sidebar" id="closeSidebarBtn">✕</button>
    </div>
    <div class="slide-list" id="slideList">
        <div class="no-slide-text">Loading slides...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const playerElem = document.getElementById('player');
const videoElem = document.getElementById('video');
const playButton = document.getElementById('play');
const backButton = document.getElementById('back');
const fwdButton = document.getElementById('fwd');
const fsButton = document.getElementById('fs');
const controlsElem = document.getElementById('controls');
const centerPlayElem = document.getElementById('centerPlay');
const progressElem = document.getElementById('progress');
const barElem = document.getElementById('bar');
const thumbElem = document.getElementById('thumb');
const tgPopupElem = document.getElementById('tgPopup');
const continueBtn = document.getElementById('continueBtn');
const timeDisplayElem = document.getElementById('time');
const settingsElem = document.getElementById('settings');
const settingsBtnElem = document.getElementById('settingsBtn');
const speedSelect = document.getElementById('speed');
const qualitySelect = document.getElementById('quality');
const statusElem = document.getElementById('status');
const dotMenuBtn = document.getElementById('dotMenuBtn');
const dropdownMenuElem = document.getElementById('dropdownMenu');
const notesItem = document.getElementById('notesItem');
const slidesItem = document.getElementById('slidesItem');
const downloadItem = document.getElementById('downloadItem');
const sidebarElem = document.getElementById('sidebar');
const closeSidebarBtn = document.getElementById('closeSidebarBtn');
const slideListElem = document.getElementById('slideList');

let isDragging = false, hideTimeoutRef, hlsInstance, wasVideoPlaying = false;
let globalNotesUrl = "";
let globalSlidesArray = [];

if (continueBtn) {
    continueBtn.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (tgPopupElem) tgPopupElem.style.display = "none";
        if (centerPlayElem) centerPlayElem.classList.remove("hide");
        if (controlsElem) {
            controlsElem.classList.remove("hide");
            clearTimeout(hideTimeoutRef);
            hideTimeoutRef = setTimeout(() => controlsElem.classList.add("hide"), 3000);
        }
    };
}

function updateStatusText(msg, type = 'info') {
    if (!statusElem) return;
    statusElem.innerText = msg;
    statusElem.style.display = "block";
    if (type === 'success') {
        setTimeout(() => { statusElem.style.display = 'none'; }, 2500);
    }
}

if (dotMenuBtn) {
    dotMenuBtn.onclick = (e) => {
        e.stopPropagation();
        dropdownMenuElem.classList.toggle('active');
    };
}

if (slidesItem) {
    slidesItem.onclick = (e) => {
        e.stopPropagation();
        dropdownMenuElem.classList.remove('active');
        sidebarElem.classList.add('active');
    };
}

if (closeSidebarBtn) {
    closeSidebarBtn.onclick = (e) => {
        e.stopPropagation();
        sidebarElem.classList.remove('active');
    };
}

if (notesItem) {
    notesItem.onclick = (e) => {
        e.stopPropagation();
        dropdownMenuElem.classList.remove('active');
        if (globalNotesUrl) {
            window.open(globalNotesUrl, '_blank');
        } else {
            alert('Notes not available for this session.');
        }
    };
}

if (downloadItem) {
    downloadItem.onclick = (e) => {
        e.stopPropagation();
        dropdownMenuElem.classList.remove('active');
        alert('Download feature coming soon!');
    };
}

window.addEventListener('click', () => { 
    if (dropdownMenuElem) dropdownMenuElem.classList.remove('active'); 
});

const urlParamsExtractor = new URLSearchParams(location.search);
const bId = urlParamsExtractor.get("batchId");
const sId = urlParamsExtractor.get("subjectId");
const lId = urlParamsExtractor.get("lectureId");
const directStreamUrl = urlParamsExtractor.get("m3u8Url") || urlParamsExtractor.get("Url");

async function initializePlayerEngine() {
    let resolvedStreamUrl = "";
    
    if (directStreamUrl) {
        resolvedStreamUrl = decodeURIComponent(directStreamUrl);
    } else if (bId && sId && lId) {
        try {
            updateStatusText('🔄 Fetching secure configurations...');
            const endpointRoute = `https://devcoderz-backend.vercel.app/api/config`;
            
            const networkResponse = await fetch(endpointRoute, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ batchId: bId, subjectId: sId, lectureId: lId })
            });

            if (!networkResponse.ok) throw new Error(`Network failure code: ${networkResponse.status}`);
            const responsePayload = await networkResponse.json();
            
            if (responsePayload) {
                resolvedStreamUrl = responsePayload.m3u8Url || responsePayload.url;
                if (responsePayload.notes && responsePayload.notes.length > 0) {
                    globalNotesUrl = responsePayload.notes[0].url;
                }
                if (responsePayload.slides && responsePayload.slides.length > 0) {
                    globalSlidesArray = responsePayload.slides;
                    buildSlideItems();
                } else {
                    slideListElem.innerHTML = `<div class="no-slide-text">No slides found for this lecture.</div>`;
                }
            }
        } catch (err) {
            updateStatusText('❌ Error connecting to stream service', 'error');
            slideListElem.innerHTML = `<div class="no-slide-text">Failed to load slides.</div>`;
            return;
        }
    } else {
        updateStatusText('❌ Required parameters missing!', 'error');
        slideListElem.innerHTML = `<div class="no-slide-text">Missing parameters.</div>`;
        return;
    }

    if (!resolvedStreamUrl) {
        updateStatusText('❌ Target stream source not found!', 'error');
        return;
    }

    setupHlsPlayer(resolvedStreamUrl);
}

function setupHlsPlayer(url) {
    updateStatusText('🔄 Initializing stream buffer...');

    if (videoElem.canPlayType('application/vnd.apple.mpegurl')) {
        videoElem.src = url;
        videoElem.addEventListener('loadedmetadata', () => {
            updateStatusText('✅ Playing natively via HLS', 'success');
        });
    } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
        hlsInstance = new Hls({ 
            enableWorker: true, 
            lowLatencyMode: true,
            maxBufferLength: 30,
            maxMaxBufferLength: 60
        });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(videoElem);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            updateStatusText('✅ Stream ready!', 'success');
            qualitySelect.innerHTML = '<option value="-1">AUTO</option>';
            hlsInstance.levels.forEach((lvl, idx) => {
                let opt = document.createElement("option");
                opt.value = idx;
                opt.text = lvl.height + "p";
                qualitySelect.appendChild(opt);
            });
        });

        hlsInstance.on(Hls.Events.LEVEL_SWITCHED, (ev, data) => {
            qualitySelect.value = data.level;
        });

        hlsInstance.on(Hls.Events.ERROR, (ev, data) => {
            if (data.fatal) {
                switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        hlsInstance.startLoad();
                        break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                        hlsInstance.recoverMediaError();
                        break;
                    default:
                        hlsInstance.destroy();
                        updateStatusText('❌ Fatal stream error encountered', 'error');
                        break;
                }
            }
        });
    } else {
        updateStatusText('❌ Unsupported browser configuration', 'error');
    }
}

function buildSlideItems() {
    if (!slideListElem) return;
    slideListElem.innerHTML = "";
    globalSlidesArray.forEach((slide) => {
        const card = document.createElement('div');
        card.className = 'slide-item';
        const timeStr = formatTimestamp(slide.timestamp);
        
        card.innerHTML = `
            <img src="${slide.image}" alt="Slide Image" onerror="this.src='https://via.placeholder.com/400x220?text=Slide+Preview+Not+Available'">
            <div class="slide-footer-info">
                <div class="slide-time-badge">🕒 ${timeStr}</div>
            </div>
        `;
        card.onclick = (e) => {
            e.stopPropagation();
            videoElem.currentTime = slide.timestamp;
            triggerSafePlayback();
            sidebarElem.classList.remove('active');
        };
        slideListElem.appendChild(card);
    });
}

window.addEventListener('load', () => {
    setTimeout(initializePlayerEngine, 400);
});

function formatTimestamp(sec) {
    if (!sec || isNaN(sec) || sec === Infinity) return "00:00:00";
    let h = Math.floor(sec / 3600);
    let m = Math.floor((sec % 3600) / 60);
    let s = Math.floor(sec % 60);
    return [h, m, s].map(num => String(num).padStart(2, "0")).join(":");
}

function refreshProgressBarUI(pct, curr, dur) {
    if (!barElem || !thumbElem || !timeDisplayElem) return;
    barElem.style.width = pct + "%";
    thumbElem.style.left = pct + "%";
    timeDisplayElem.innerText = `${formatTimestamp(curr)} / ${formatTimestamp(dur)}`;
}

function triggerSafePlayback() {
    videoElem.play().catch(() => {
        videoElem.muted = true;
        videoElem.play();
    });
}

function handleControlVisibility(permanent = false) {
    if (!controlsElem) return;
    controlsElem.classList.remove("hide");
    clearTimeout(hideTimeoutRef);
    if (!permanent) {
        hideTimeoutRef = setTimeout(() => controlsElem.classList.add("hide"), 3000);
    }
}

if (centerPlayElem) {
    centerPlayElem.onclick = e => {
        e.preventDefault();
        e.stopPropagation();
        triggerSafePlayback();
    };
}

if (playButton) {
    playButton.onclick = e => {
        e.preventDefault();
        e.stopPropagation();
        videoElem.paused ? triggerSafePlayback() : videoElem.pause();
    };
}

if (backButton) {
    backButton.onclick = e => {
        e.preventDefault();
        e.stopPropagation();
        videoElem.currentTime = Math.max(0, videoElem.currentTime - 10);
        handleControlVisibility(true);
    };
}

if (fwdButton) {
    fwdButton.onclick = e => {
        e.preventDefault();
        e.stopPropagation();
        videoElem.currentTime = Math.min(videoElem.duration, videoElem.currentTime + 10);
        handleControlVisibility(true);
    };
}

if (settingsBtnElem) {
    settingsBtnElem.onclick = e => {
        e.preventDefault();
        e.stopPropagation();
        settingsElem.style.display = (settingsElem.style.display === "block" ? "none" : "block");
        handleControlVisibility(true);
    };
}

if (speedSelect) {
    speedSelect.onchange = () => {
        videoElem.playbackRate = parseFloat(speedSelect.value);
    };
}

if (qualitySelect) {
    qualitySelect.onchange = () => {
        if (hlsInstance) hlsInstance.currentLevel = parseInt(qualitySelect.value);
    };
}

if (fsButton) {
    fsButton.onclick = async e => {
        e.preventDefault();
        e.stopPropagation();
        try {
            if (!document.fullscreenElement) {
                await playerElem.requestFullscreen();
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape').catch(() => {});
                }
            } else {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
                await document.exitFullscreen();
            }
        } catch (err) {}
    };
}

function extractPointerPosition(e) {
    const rect = progressElem.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let calcPos = (clientX - rect.left) / rect.width;
    return Math.max(0, Math.min(1, calcPos));
}

if (progressElem) {
    progressElem.onpointerdown = e => {
        e.preventDefault();
        e.stopPropagation();
        isDragging = true;
        wasVideoPlaying = !videoElem.paused;
        videoElem.pause();
        progressElem.setPointerCapture(e.pointerId);
        let pos = extractPointerPosition(e);
        if (videoElem.duration) {
            videoElem.currentTime = pos * videoElem.duration;
            refreshProgressBarUI(pos * 100, videoElem.currentTime, videoElem.duration);
        }
    };

    progressElem.onpointermove = e => {
        if (!isDragging) return;
        e.preventDefault();
        e.stopPropagation();
        let pos = extractPointerPosition(e);
        if (videoElem.duration) {
            videoElem.currentTime = pos * videoElem.duration;
            refreshProgressBarUI(pos * 100, videoElem.currentTime, videoElem.duration);
        }
    };

    progressElem.onpointerup = e => {
        if (!isDragging) return;
        e.preventDefault();
        e.stopPropagation();
        isDragging = false;
        try { progressElem.releasePointerCapture(e.pointerId); } catch(err) {}
        if (wasVideoPlaying) { triggerSafePlayback(); }
    };
}

videoElem.ontimeupdate = () => {
    if (!isDragging && videoElem.duration) {
        refreshProgressBarUI((videoElem.currentTime / videoElem.duration) * 100, videoElem.currentTime, videoElem.duration);
    }
};

videoElem.onloadedmetadata = () => {
    if (videoElem.duration) {
        refreshProgressBarUI(0, videoElem.currentTime, videoElem.duration);
    }
};

videoElem.onplay = () => {
    if (playButton) playButton.classList.add("pause");
    if (centerPlayEmoji = document.getElementById('centerPlay')) centerPlayEmoji.classList.add("hide");
    handleControlVisibility();
};

videoElem.onpause = () => {
    if (playButton) playButton.classList.remove("pause");
    handleControlVisibility(true);
};

playerElem.onclick = e => {
    if (tgPopupElem && tgPopupElem.style.display !== "none") return;
    if (e.target === videoElem || e.target === playerElem) {
        sidebarElem.classList.remove('active');
        if (controlsElem.classList.contains("hide")) {
            handleControlVisibility();
        } else {
            controlsElem.classList.add("hide");
            settingsElem.style.display = "none";
        }
    }
};
</script>
</body>
</html>
