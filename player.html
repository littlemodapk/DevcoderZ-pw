<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DevCoderz Ultra Secure Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}.player{position:fixed;inset:0;background:#000;pointer-events:auto;touch-action:manipulation}video{width:100%;height:100%;object-fit:contain}.top-brand{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:40;text-align:center;pointer-events:none}.top-brand .jsr{color:#ff9800;font-weight:700;font-size:14px}.top-brand .dev{margin-top:4px;font-size:12px;font-weight:600;color:#00e5ff;text-shadow:0 0 6px #00e5ff, 0 0 12px #00e5ff}.center-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;cursor:pointer}.center-play.hide{display:none}.center-play span{width:90px;height:90px;background:rgba(255,255,255,.25);backdrop-filter:blur(5px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff}.controls{position:absolute;bottom:0;width:100%;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.9));transition:.3s;z-index:35;touch-action:none}.controls.hide{transform:translateY(100%);opacity:0}.progress{height:7px;background:#555;border-radius:10px;position:relative;margin-bottom:6px;touch-action:none;cursor:pointer}.progress-fill{height:100%;width:0;background:#2196f3;border-radius:10px;pointer-events:none}.thumb{position:absolute;top:50%;width:18px;height:18px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);left:0;pointer-events:none}.time{color:#fff;font-size:11px;text-align:right;margin-bottom:4px}.row{display:flex;align-items:center;gap:6px;justify-content:space-between;color:#fff}.btn{width:40px;height:40px;border:1.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}#play{font-size:0}#play::before{content:"▶";font-size:16px}#play.pause::before{content:"❚❚";font-size:14px}.settings{position:absolute;bottom:70px;right:10px;background:#111;border-radius:12px;padding:12px;width:160px;display:none;z-index:50}.settings label{color:#aaa;font-size:10px;display:block;margin-bottom:4px}.settings select{width:100%;background:#000;color:#fff;border:1px solid #555;border-radius:4px;height:24px;margin-bottom:10px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100}.box{width:320px;padding:26px;border-radius:22px;text-align:center;background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff}.tg-btn{display:block;margin-top:14px;padding:14px;border-radius:28px;font-weight:700;width:100%;cursor:pointer;text-align:center;text-decoration:none;color:#fff}.join{background:#fff;color:#1e3c72}.continue{background:rgba(0,0,0,.25);border:1px solid #fff}#status{position:absolute;bottom:20px;left:20px;color:#4fc3f7;background:rgba(0,0,0,.8);padding:6px 12px;border-radius:6px;font-size:12px;z-index:50;pointer-events:none}.menu-container{position:absolute;top:15px;right:20px;z-index:60}.dot-btn{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}.dropdown-menu{display:none;position:absolute;right:0;top:45px;background:#1c1c1c;border:1px solid #333;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.8);width:140px;overflow:hidden}.dropdown-menu.active{display:block}.dropdown-item{padding:12px 16px;font-size:13px;color:#fff;cursor:pointer;border-bottom:1px solid #2a2a2a}.dropdown-item:hover{background:#333}#sidebar{position:absolute;top:0;right:-320px;width:320px;height:100%;background:rgba(20,20,20,.95);backdrop-filter:blur(5px);transition:right .3s ease;z-index:70;display:flex;flex-direction:column;border-left:1px solid #333}#sidebar.active{right:0}.sidebar-header{padding:15px;background:#111;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2c2c2c;color:#fff;font-weight:bold;font-size:14px}.close-sidebar{background:none;border:none;color:#aaa;font-size:18px;cursor:pointer}.close-sidebar:hover{color:#fff}.slide-list{padding:15px;display:flex;flex-direction:column;gap:15px;overflow-y:auto;flex:1}.slide-item{position:relative;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:border-color .2s;overflow:hidden;background:#000}.slide-item:hover{border-color:#00e5ff}.slide-item img{width:100%;display:block;object-fit:contain}.slide-time{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>

<div class="overlay" id="tgPopup">
 <div class="box">
  <h2>Join our Telegram</h2>
  <a class="tg-btn join" href="https://t.me/+JXdxtVzQf-NhM2Jl" target="_blank">Join Telegram</a>
  <div class="tg-btn continue" id="continueBtn">Continue to Video</div>
 </div>
</div>

<div class="player" id="player">
 <div id="status">🔄 Initializing...</div>

 <div class="menu-container">
    <button class="dot-btn" onclick="toggleMenu(event)">⋮</button>
    <div class="dropdown-menu" id="dropdownMenu">
        <div class="dropdown-item" onclick="openNotes(event)">📄 Notes</div>
        <div class="dropdown-item" onclick="toggleSidebar(event)">🖼️ Slides</div>
        <div class="dropdown-item" onclick="alert('Download feature coming soon!'); toggleMenu(event);">📥 Download</div>
    </div>
 </div>

 <video id="video" playsinline></video>
 
 <div class="top-brand">
  <div class="jsr">🚩 Jai Shree Ram 🚩</div>
  <div class="dev">Developed by - Devansh Sharma</div>
 </div>
 
 <div class="center-play" id="centerPlay"><span>▶</span></div>
 
 <div class="controls hide" id="controls">
  <div class="progress" id="progress"><div class="progress-fill" id="bar"></div><div class="thumb" id="thumb"></div></div>
  <div class="time" id="time">00:00:00 / 00:00:00</div>
  <div class="row">
   <div class="btn" id="back">⟲10</div>
   <div class="btn" id="play"></div>
   <div class="btn" id="fwd">10⟳</div>
   <div class="btn" id="settingsBtn">⚙️</div>
   <div class="btn" id="fs">⛶</div>
  </div>
 </div>
 
 <div class="settings" id="settings">
  <label>Speed</label>
  <select id="speed">
   <option value="1" selected>1x</option>
   <option value="1.25">1.25x</option>
   <option value="1.5">1.5x</option>
   <option value="1.75">1.75x</option>
   <option value="2">2x</option>
   <option value="2.25">2.25x</option>
   <option value="2.5">2.5x</option>
   <option value="2.75">2.75x</option>
  </select>
  <label>Quality</label>
  <select id="quality"><option value="-1">AUTO</option></select>
 </div>

 <div id="sidebar" onclick="event.stopPropagation()">
    <div class="sidebar-header">
        <span>Lecture Slides</span>
        <button class="close-sidebar" onclick="toggleSidebar(event)">✕</button>
    </div>
    <div class="slide-list" id="slideList"></div>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="player-script.js"></script>
</body>
</html>
