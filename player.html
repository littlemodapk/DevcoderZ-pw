<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DevCoderz Ultra Smooth Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}
.player{position:fixed;inset:0;background:#000;pointer-events:auto;touch-action:manipulation}
video{width:100%;height:100%;object-fit:contain}
.top-brand{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:40;text-align:center;pointer-events:none}
.top-brand .jsr{color:#ff9800;font-weight:700;font-size:14px}
.top-brand .dev{margin-top:4px;font-size:12px;font-weight:600;color:#00e5ff;text-shadow:0 0 6px #00e5ff, 0 0 12px #00e5ff}
.center-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;cursor:pointer}
.center-play.hide{display:none}
.center-play span{width:90px;height:90px;background:rgba(255,255,255,.25);backdrop-filter:blur(5px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff}
.controls{position:absolute;bottom:0;width:100%;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.9));transition:.3s;z-index:35;touch-action:none}
.controls.hide{transform:translateY(100%);opacity:0}
.progress{height:7px;background:#555;border-radius:10px;position:relative;margin-bottom:6px;touch-action:none;cursor:pointer}
.progress-fill{height:100%;width:0;background:#2196f3;border-radius:10px;pointer-events:none}
.thumb{position:absolute;top:50%;width:18px;height:18px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);left:0;pointer-events:none}
.time{color:#fff;font-size:11px;text-align:right;margin-bottom:4px}
.row{display:flex;align-items:center;gap:6px;justify-content:space-between;color:#fff}
.btn{width:40px;height:40px;border:1.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
#play{font-size:0}
#play::before{content:"▶";font-size:16px}
#play.pause::before{content:"❚❚";font-size:14px}
.settings{position:absolute;bottom:70px;right:10px;background:#111;border-radius:12px;padding:12px;width:160px;display:none;z-index:50}
.settings label{color:#aaa;font-size:10px;display:block;margin-bottom:4px}
.settings select{width:100%;background:#000;color:#fff;border:1px solid #555;border-radius:4px;height:24px;margin-bottom:10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100}
.box{width:320px;padding:26px;border-radius:22px;text-align:center;background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff}
.tg-btn{display:block;margin-top:14px;padding:14px;border-radius:28px;font-weight:700;width:100%;cursor:pointer;text-align:center;text-decoration:none;color:#fff}
.join{background:#fff;color:#1e3c72}
.continue{background:rgba(0,0,0,.25);border:1px solid #fff}

/* --- Status / Loading Indicator --- */
#status {
    position: absolute;
    bottom: 20px;
    left: 20px;
    color: #4fc3f7;
    background: rgba(0,0,0,0.8);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    z-index: 50;
    pointer-events: none;
}

/* --- DevCoderz New Additions --- */
.lecture-title {
    position: absolute;
    top: 15px;
    left: 20px;
    z-index: 40;
    background: rgba(0, 0, 0, 0.6);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    color: #fff;
    max-width: 50%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border: 1px solid rgba(255,255,255,0.2);
    pointer-events: none;
}
.menu-container {
    position: absolute;
    top: 15px;
    right: 20px;
    z-index: 60;
}
.dot-btn {
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 20px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
.dropdown-menu {
    display: none;
    position: absolute;
    right: 0;
    top: 45px;
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    width: 140px;
    overflow: hidden;
}
.dropdown-menu.active { display: block; }
.dropdown-item {
    padding: 12px 16px;
    font-size: 13px;
    color: #fff;
    cursor: pointer;
    border-bottom: 1px solid #2a2a2a;
}
.dropdown-item:hover { background: #333; }

/* Slide Sidebar as an Overlay */
#sidebar {
    position: absolute;
    top: 0;
    right: -320px;
    width: 320px;
    height: 100%;
    background: rgba(20, 20, 20, 0.95);
    backdrop-filter: blur(5px);
    transition: right 0.3s ease;
    z-index: 70;
    display: flex;
    flex-direction: column;
    border-left: 1px solid #333;
}
#sidebar.active { right: 0; }
.sidebar-header {
    padding: 15px;
    background: #111;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #2c2c2c;
    color: #fff;
    font-weight: bold;
    font-size: 14px;
}
.close-sidebar {
    background: none;
    border: none;
    color: #aaa;
    font-size: 18px;
    cursor: pointer;
}
.close-sidebar:hover { color: #fff; }
.slide-list {
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    overflow-y: auto;
    flex: 1;
}
.slide-item {
    position: relative;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.2s;
    overflow: hidden;
    background: #000;
}
.slide-item:hover { border-color: #00e5ff; }
.slide-item img {
    width: 100%;
    display: block;
    object-fit: contain;
}
.slide-time {
    position: absolute;
    bottom: 5px;
    right: 5px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
}
</style>
</head>
<body>

<div class="overlay" id="tgPopup">
 <div class="box">
  <h2>Join our Telegram</h2>
  <a class="tg-btn join" href="https://t.me/+JXdxtVzQf-NhM2Jl" target="_blank">Join Telegram</a>
  <div class="tg-btn continue" id="continueBtn">Continue to Video</div>
 </div>
</div>

<div class="player" id="player">
 
 <div class="lecture-title" id="lectureTitle">Loading Lecture...</div>
 <div id="status">🔄 Initializing...</div>

 <div class="menu-container">
    <button class="dot-btn" onclick="toggleMenu(event)">⋮</button>
    <div class="dropdown-menu" id="dropdownMenu">
        <div class="dropdown-item" onclick="openNotes(event)">📄 Notes</div>
        <div class="dropdown-item" onclick="toggleSidebar(event)">🖼️ Slides</div>
        <div class="dropdown-item" onclick="alert('Download feature coming soon!'); toggleMenu(event);">📥 Download</div>
    </div>
 </div>

 <video id="video" playsinline></video>
 
 <div class="top-brand">
  <div class="jsr">🚩 Jai Shree Ram 🚩</div>
  <div class="dev">Developed by - Devansh Sharma</div>
 </div>
 
 <div class="center-play" id="centerPlay"><span>▶</span></div>
 
 <div class="controls hide" id="controls">
  <div class="progress" id="progress"><div class="progress-fill" id="bar"></div><div class="thumb" id="thumb"></div></div>
  <div class="time" id="time">00:00:00 / 00:00:00</div>
  <div class="row">
   <div class="btn" id="back">⟲10</div>
   <div class="btn" id="play"></div>
   <div class="btn" id="fwd">10⟳</div>
   <div class="btn" id="settingsBtn">⚙️</div>
   <div class="btn" id="fs">⛶</div>
  </div>
 </div>
 
 <div class="settings" id="settings">
  <label>Speed</label>
  <select id="speed">
   <option value="1" selected>1x</option>
   <option value="1.25">1.25x</option>
   <option value="1.5">1.5x</option>
   <option value="1.75">1.75x</option>
   <option value="2">2x</option>
   <option value="2.25">2.25x</option>
   <option value="2.5">2.5x</option>
   <option value="2.75">2.75x</option>
  </select>
  <label>Quality</label>
  <select id="quality"><option value="-1">AUTO</option></select>
 </div>

 <div id="sidebar" onclick="event.stopPropagation()">
    <div class="sidebar-header">
        <span>Lecture Slides</span>
        <button class="close-sidebar" onclick="toggleSidebar(event)">✕</button>
    </div>
    <div class="slide-list" id="slideList"></div>
 </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const player=document.getElementById("player"),v=document.getElementById("video"),playBtn=document.getElementById("play"),back=document.getElementById("back"),fwd=document.getElementById("fwd"),fs=document.getElementById("fs"),controls=document.getElementById("controls"),centerPlay=document.getElementById("centerPlay"),progress=document.getElementById("progress"),bar=document.getElementById("bar"),thumb=document.getElementById("thumb"),tgPopup=document.getElementById("tgPopup"),continueBtn=document.getElementById("continueBtn"),timeDisplay=document.getElementById("time"),settings=document.getElementById("settings"),settingsBtn=document.getElementById("settingsBtn"),speed=document.getElementById("speed"),quality=document.getElementById("quality"),statusDiv=document.getElementById("status");
const lectureTitle=document.getElementById('lectureTitle'), dropdownMenu=document.getElementById('dropdownMenu'), sidebar=document.getElementById('sidebar'), slideList=document.getElementById('slideList');

let drag=false,hideTimer,hls,wasPlaying=false;
let notesUrl = "";
let slidesData = [];

function setStatus(msg, type = 'info') {
    statusDiv.innerText = msg;
    statusDiv.style.display = "block";
    if(type === 'success') {
        setTimeout(() => { statusDiv.style.display = 'none'; }, 3000);
    }
}

function toggleMenu(e) {
    e.stopPropagation();
    dropdownMenu.classList.toggle('active');
}
function toggleSidebar(e) {
    e.stopPropagation();
    dropdownMenu.classList.remove('active');
    sidebar.classList.toggle('active');
}
function openNotes(e) {
    e.stopPropagation();
    dropdownMenu.classList.remove('active');
    if (notesUrl) window.open(notesUrl, '_blank');
    else alert('Notes not available for this lecture.');
}
window.addEventListener('click', () => { dropdownMenu.classList.remove('active'); });

// URL Parsing & API Integration
const urlParams=new URLSearchParams(location.search);
const batchId = urlParams.get("batchId");
const subjectId = urlParams.get("subjectId");
const lectureId = urlParams.get("lectureId");
const rawUrl = urlParams.get("m3u8Url") || urlParams.get("Url");

async function initDynamicPlayer() {
    let streamUrl = "";
    
    if (rawUrl) {
        streamUrl = decodeURIComponent(rawUrl);
    } else if (batchId && subjectId && lectureId) {
        try {
            setStatus('🔄 Fetching config...');
            const apiUrl = `https://devcoderz-backend.vercel.app/api/config?batchId=${batchId}&subjectId=${subjectId}&lectureId=${lectureId}`;
            const res = await fetch(apiUrl);
            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
            const json = await res.json();
            
            if (json) {
                streamUrl = json.m3u8Url || json.url;
                if (json.topic_name) {
                    lectureTitle.innerText = json.topic_name;
                    document.title = json.topic_name + " - DevCoderz";
                } else {
                    lectureTitle.style.display = 'none';
                }
                if (json.notes && json.notes.length > 0) notesUrl = json.notes[0].url;
                if (json.slides && json.slides.length > 0) {
                    slidesData = json.slides;
                    renderSlides();
                }
            }
        } catch (e) {
            setStatus('❌ Error fetching API config', 'error');
            return;
        }
    } else {
        setStatus('❌ Missing parameters in URL!', 'error');
        return;
    }

    if (!streamUrl) {
        setStatus('❌ Stream URL not found!', 'error');
        return;
    }

    loadHlsStream(streamUrl);
}

// 100% Robust HLS Loading Mechanism
function loadHlsStream(url) {
    setStatus('🔄 Loading stream...');

    if (v.canPlayType('application/vnd.apple.mpegurl')) {
        v.src = url;
        v.addEventListener('loadedmetadata', () => {
            setStatus('✅ Playing via Native HLS', 'success');
        });
    } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
        hls = new Hls({ 
            enableWorker: true, 
            lowLatencyMode: true,
            maxBufferLength: 30,
            maxMaxBufferLength: 60
        });
        hls.loadSource(url);
        hls.attachMedia(v);

        hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
            setStatus('✅ Stream loaded!', 'success');
            quality.innerHTML = '<option value="-1">AUTO</option>';
            hls.levels.forEach((l, i) => {
                let o = document.createElement("option");
                o.value = i;
                o.text = l.height + "p";
                quality.appendChild(o);
            });
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, (e, data) => {
            quality.value = data.level;
        });

        hls.on(Hls.Events.ERROR, function(event, data) {
            if (data.fatal) {
                switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        hls.startLoad();
                        break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                        hls.recoverMediaError();
                        break;
                    default:
                        hls.destroy();
                        setStatus('❌ Stream playback error', 'error');
                        break;
                }
            }
        });
    } else {
        setStatus('❌ HLS not supported', 'error');
    }
}

function renderSlides() {
    slideList.innerHTML = "";
    slidesData.forEach((slide) => {
        const item = document.createElement('div');
        item.className = 'slide-item';
        const timeFormatted = fmt(slide.timestamp);
        
        item.innerHTML = `
            <img src="${slide.image}" alt="Slide">
            <div class="slide-time">🕒 ${timeFormatted}</div>
        `;
        item.onclick = (e) => {
            e.stopPropagation();
            v.currentTime = slide.timestamp;
            v.play();
            if(window.innerWidth < 600) sidebar.classList.remove('active');
        };
        slideList.appendChild(item);
    });
}

window.addEventListener('load', () => {
    setTimeout(initDynamicPlayer, 300);
});

function fmt(t){if(!t||isNaN(t)||t===Infinity)return"00:00:00";let h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=Math.floor(t%60);return[h,m,s].map(n=>String(n).padStart(2,"0")).join(":");}
function updateProgressUI(percent, currentTime, duration){
    bar.style.width=percent+"%";
    thumb.style.left=percent+"%";
    timeDisplay.innerText=`${fmt(currentTime)} / ${fmt(duration)}`;
}
function safePlay(){v.play().catch(()=>{v.muted=true;v.play();});}
function show(f=false){controls.classList.remove("hide");clearTimeout(hideTimer);if(!f)hideTimer=setTimeout(()=>controls.classList.add("hide"),3000);}

continueBtn.onclick=e=>{e.preventDefault();e.stopPropagation();tgPopup.style.display="none";centerPlay.classList.remove("hide");controls.classList.remove("hide");show();};
centerPlay.onclick=e=>{e.preventDefault();e.stopPropagation();safePlay();};
playBtn.onclick=e=>{e.preventDefault();e.stopPropagation();v.paused?safePlay():v.pause();};
back.onclick=e=>{e.preventDefault();e.stopPropagation();v.currentTime=Math.max(0,v.currentTime-10);show(true);};
fwd.onclick=e=>{e.preventDefault();e.stopPropagation();v.currentTime=Math.min(v.duration,v.currentTime+10);show(true);};
settingsBtn.onclick=e=>{e.preventDefault();e.stopPropagation();settings.style.display=(settings.style.display==="block"?"none":"block");show(true);};
speed.onchange=e=>{v.playbackRate=parseFloat(speed.value);};
quality.onchange=e=>{if(hls)hls.currentLevel=parseInt(quality.value);};

fs.onclick = async e => {
    e.preventDefault();
    e.stopPropagation();
    try {
        if (!document.fullscreenElement) {
            await player.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
                await screen.orientation.lock('landscape').catch(() => {});
            }
        } else {
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
            await document.exitFullscreen();
        }
    } catch (err) {}
};

function getPosition(e){
    const rect=progress.getBoundingClientRect();
    const clientX=e.touches?e.touches[0].clientX:e.clientX;
    let pos=(clientX-rect.left)/rect.width;
    return Math.max(0,Math.min(1,pos));
}

progress.onpointerdown=e=>{
    e.preventDefault();
    e.stopPropagation();
    drag=true;
    wasPlaying=!v.paused;
    v.pause();
    progress.setPointerCapture(e.pointerId);
    let pos=getPosition(e);
    if(v.duration){
        v.currentTime=pos*v.duration;
        updateProgressUI(pos*100,v.currentTime,v.duration);
    }
};

progress.onpointermove=e=>{
    if(!drag)return;
    e.preventDefault();
    e.stopPropagation();
    let pos=getPosition(e);
    if(v.duration){
        v.currentTime=pos*v.duration;
        updateProgressUI(pos*100,v.currentTime,v.duration);
    }
};

progress.onpointerup=e=>{
    if(!drag)return;
    e.preventDefault();
    e.stopPropagation();
    drag=false;
    try{progress.releasePointerCapture(e.pointerId);}catch(err){}
    if(wasPlaying){safePlay();}
};

v.ontimeupdate=()=>{
    if(!drag&&v.duration){
        updateProgressUI((v.currentTime/v.duration)*100,v.currentTime,v.duration);
    }
};

v.onloadedmetadata=()=>{
    if(v.duration){
        updateProgressUI(0,v.currentTime,v.duration);
    }
};

v.onplay=()=>{playBtn.classList.add("pause");centerPlay.classList.add("hide");show();};
v.onpause=()=>{playBtn.classList.remove("pause");centerPlay.classList.add("hide");show(true);};

player.onclick=e=>{
    if(tgPopup.style.display!=="none")return;
    if(e.target===v||e.target===player){
        sidebar.classList.remove('active');
        if(controls.classList.contains("hide")) show();
        else { controls.classList.add("hide"); settings.style.display="none"; }
    }
};
</script>
</body>
</html>
